<style>
/* Layout: an operations tool for staff on the move - dark-first, high-contrast, big tap targets, team colour as the main signal. Phone column, five-tab bar. */
:root{
  --bg:#001a33; --panel:#062a4c; --panel-2:#0b345c; --fg:#eef3f8; --muted:#9fb3c9; --line:#1b4570;
  --gold:#DBAB1A; --urgent:#e0533f; --ok:#3fae6b; --info:#4a90d9;
  --display:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#eef1f6; --panel:#ffffff; --panel-2:#f3f5f9; --fg:#0f1a2c; --muted:#56627a; --line:#d6dce8; color-scheme:light } }
:root[data-theme="light"]{ --bg:#eef1f6; --panel:#ffffff; --panel-2:#f3f5f9; --fg:#0f1a2c; --muted:#56627a; --line:#d6dce8; color-scheme:light }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#00112E;color:#eef1f6;padding:12px 16px;border-bottom:3px solid var(--team,#DBAB1A)}
.row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.16em;color:#DBAB1A}
.who{display:flex;align-items:center;gap:8px;border:1px solid #2c3f63;border-radius:999px;padding:5px 10px 5px 6px;background:transparent;color:#eef1f6;font-size:13px;font-weight:600}
.sw{width:14px;height:14px;border-radius:4px;background:var(--team,#DBAB1A);flex:0 0 auto}
main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:20px}
.label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.notice{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.now{padding:16px;display:flex;flex-direction:column;gap:10px;border-left:6px solid var(--team)}
.now .where{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;text-transform:uppercase}
.now .when{font-family:var(--mono);font-size:15px}
.now .task{color:var(--muted)}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.kv b{font-weight:700}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--gold);color:#16120a}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--urgent);color:#fff}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.t{font-family:var(--mono);font-size:13px}
.t span{display:block;color:var(--muted);font-size:11px}
.ti{font-weight:700;line-height:1.25}
.sub{font-size:12.5px;color:var(--muted)}
.pill{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 8px;white-space:nowrap}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px}
.days button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#16120a}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.team{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.team .n{font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;line-height:1.05}
.team[aria-pressed="true"]{box-shadow:0 0 0 2px var(--c)}
.roster .item{grid-template-columns:auto minmax(0,1fr) auto}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#0c1524;background:var(--c)}
.chan{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chan button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.chan button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.msgs{display:flex;flex-direction:column;gap:10px;min-height:280px}
.msg{max-width:84%;display:flex;flex-direction:column;gap:3px}
.msg .bub{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 12px}
.msg.me{align-self:flex-end}
.msg.me .bub{background:var(--gold);color:#16120a;border-color:var(--gold);border-radius:14px 14px 4px 14px}
.msg .by{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.msg.me .by{justify-content:flex-end}
.msg.loc .bub{border-left:4px solid var(--info)}
.compose{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding-top:8px}
.compose input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.alert{display:grid;grid-template-columns:6px minmax(0,1fr);gap:12px;padding:12px;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .bar{border-radius:4px;background:var(--info)}
.alert.urgent .bar{background:var(--urgent)}
.alert.done{opacity:.55}
.field{display:flex;flex-direction:column;gap:4px}
.field select,.field input,.field textarea{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#00112E;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid #1d2c48}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{position:relative;background:none;border:0;color:#8c99b3;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:4px 2px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:#DBAB1A}
.dotc{position:absolute;top:0;right:22%;background:var(--urgent);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:480px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#00112E;color:#eef1f6;border:1px solid var(--gold);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;z-index:10;max-width:calc(100% - 32px)}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(120% 80% at 50% 0%,#0b4a7d 0%,#003057 45%,#00112E 100%);color:#eef3f8}
.gatecard{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;background:rgba(0,17,46,.55);border:1px solid rgba(219,171,26,.45);border-radius:18px;padding:24px 20px}
.gatecard .logo{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.gatecard .logo small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.2em;color:#DBAB1A;margin-bottom:4px}
.gatecard label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c9d6e4}
.gatecard input[type=email],.gatecard input[type=password],.gatecard input[type=text]{width:100%;border:1px solid #2a5a88;background:#00112E;color:#fff;border-radius:10px;padding:12px;font:inherit;font-size:16px}
.gatecard .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.gatecard .err{color:#ffb4a6;font-weight:700;min-height:1.2em;margin:0}
.gatecard .linkbtn{background:none;border:0;padding:0;color:#DBAB1A;font-weight:700;font-size:13px}
.gatecard .btn{width:100%;padding:13px;font-size:16px}
.gatecard .fine{font-size:12px;color:#a9bbd0;margin:0}
.pingban{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 24px));z-index:11;background:#DBAB1A;color:#00112E;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px}
.pingban .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.pingban .m{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;text-transform:uppercase}
.pingban .btns .btn{background:#00112E;color:#fff}
.stc{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--panel-2);border:1px solid var(--line);margin:2px 4px 0 0}
.stc.go{background:#1f6b45;border-color:#1f6b45;color:#fff}.stc.done{background:#1d5c94;border-color:#1d5c94;color:#fff}.stc.no{background:#9b2f22;border-color:#9b2f22;color:#fff}
.presets{display:flex;flex-direction:column;gap:6px}
.presets label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px}
.pm.dest{width:32px!important;height:32px!important;background:#DBAB1A;color:#00112E;border-color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(219,171,26,.75)}50%{box-shadow:0 0 0 12px rgba(219,171,26,0)}}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:16%;border:3px solid var(--gold);border-radius:14px;pointer-events:none}
.bigscan{padding:16px;font-size:20px;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}
.scanres{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:24px}
.scanres h1{font-size:clamp(40px,12vw,72px);line-height:1}
.scanres .rk{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.scanres .rh{font-family:var(--display);font-size:30px;font-weight:700;text-transform:uppercase}
.scanres .rd{font-family:var(--mono)}
.scanres .rs{max-width:360px;opacity:.95}
.scanres .btn{background:#fff;color:#0c1524;padding:14px 26px;font-size:17px;margin-top:10px}
.claimbox{background:#fff;color:#003057;border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.claimbox .ti{color:#003057}
.sheet select{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px}
.btn:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

// Demo clock: pretend it is Saturday 10:15 during the event so "now" and "next" read correctly.
const DEMO_NOW = {d:"2026-10-03", t:"10:15"};
const mins = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
function nowNext(){
  const list = myShifts().filter(s=>s[0]===DEMO_NOW.d);
  const n = mins(DEMO_NOW.t);
  const cur = list.find(s=>mins(s[1])<=n && n<mins(s[2]));
  const nxt = list.find(s=>mins(s[1])>n);
  return {cur: cur || list[0] || myShifts()[0], nxt};
}

const views = {
  shift(){
    const {cur, nxt} = nowNext(); const tm = T();
    if(!state.day || !DAYS().includes(state.day)) state.day = DAYS().includes(DEMO_NOW.d) ? DEMO_NOW.d : DAYS()[0];
    const key = cur ? cur.join("|") : ""; const done = state.checkin[key];
    const p = cur ? POSTS[cur[3]] : null;
    return `<div class="view">
      ${isLive() ? `<div class="notice">Live: chat, pings, alerts and the Gate tab are connected. Shifts below are still the sample plan (demo clock Sat Oct 3, 10:15 AM).</div>` : `<div class="notice">Mockup. Sample staffing plan on the 2026 schedule. Demo clock: Sat Oct 3, 10:15 AM.</div>`}
      ${cur ? `<section class="panel now">
        <div class="label">Be here now</div>
        <div class="where">${esc(p.name)}</div>
        <div class="when">${fmt(cur[1])} to ${fmt(cur[2])} · ${dname(cur[0])}</div>
        <div class="task">${esc(cur[4])}${cur[5] ? " · " + esc(cur[5]) : ""}</div>
        <div class="kv"><span><b>Team</b> ${esc(tm.name)}</span><span><b>Lead</b> ${esc(tm.lead)}</span><span><b>Radio</b> ${tm.radio}</span></div>
        <div class="sub">${esc(p.where)}</div>
        <div class="btns">${done ? `<span class="pill" style="background:var(--ok);color:#fff">Checked in ${done}</span>` : `<button class="btn ok" type="button" data-checkin="${esc(key)}">Check in at post</button>`}<button class="btn ghost" type="button" data-showpost="${cur[3]}">Show on map</button><button class="btn ghost" type="button" data-tab="chat">Team chat</button></div>
      </section>` : `<div class="notice">No shift assigned for this team.</div>`}
      ${nxt ? `<section class="panel" style="padding:14px;display:flex;flex-direction:column;gap:4px"><div class="label">Next</div><div class="ti">${esc(POSTS[nxt[3]].name)} at ${fmt(nxt[1])}</div><div class="sub">${esc(nxt[4])}. You'll get an alert 15 minutes before with walking time.</div></section>` : ""}
      <section class="panel" style="padding:14px;display:flex;flex-direction:column;gap:6px"><div class="label">Gate check-in code</div><div class="sub">Show or print the QR guests scan with their own phone to check themselves in.</div><div class="btns"><button class="btn" type="button" data-gateqr="MAIN">Show gate code</button></div></section>
      <section style="display:flex;flex-direction:column;gap:10px">
        <h2>My schedule</h2>
        <div class="days" role="group" aria-label="Day">${DAYS().map(d=>`<button type="button" data-day="${d}" aria-pressed="${d===state.day}">${dname(d)}</button>`).join("")}</div>
        <div class="list">${myShifts().filter(s=>s[0]===state.day).map(s=>`<div class="item"><div class="t">${fmt(s[1])}<span>to ${fmt(s[2])}</span></div><div><div class="ti">${esc(POSTS[s[3]].name)}</div><div class="sub">${esc(s[4])}</div></div><button class="btn ghost" type="button" data-showpost="${s[3]}" style="padding:7px 10px">Map</button></div>`).join("")}</div>
      </section>
    </div>`;
  },
  chat(){
    state.chatSeen = true; $("#chatDot").hidden = true;
    const ch = CHANNELS[state.chan], list = state.msgs[state.chan] || [];
    const chName = state.chan==="team" ? T().name : ch.name;
    return `<div class="view">
      <div class="chan" role="group" aria-label="Channels">${Object.entries(CHANNELS).map(([k,c])=>`<button type="button" data-chan="${k}" aria-pressed="${k===state.chan}">${k==="team"?`<span class="sw" style="background:${T().c}"></span>${esc(T().short)}`:esc(c.name)}</button>`).join("")}</div>
      <div><h2>${esc(chName)}</h2><div class="sub">${esc(state.chan==="team" ? T().radio + " · " + T().size + " people" : ch.note)}</div></div>
      <div class="msgs" id="msgs">${list.map(m=>{ const mine = m.me; const c = TEAMS[m.team]?.c || "#888"; return `<div class="msg${mine?" me":""}${m.loc?" loc":""}"><div class="by">${mine?"":`<span class="sw" style="background:${c}"></span>`}${esc(m.by)} · ${m.t}</div><div class="bub">${m.loc?"📍 ":""}${esc(m.txt)}</div></div>`; }).join("")}</div>
      <form class="compose" id="composeForm"><button type="button" class="btn ghost" data-shareloc="1" aria-label="Share my location" style="padding:8px 10px">Pin</button><button type="button" class="btn ghost" data-ping="${state.chan==="team" ? "team:"+state.team : "all:all"}" style="padding:8px 10px">Ping</button><input id="msgIn" placeholder="Message ${esc(chName)}" autocomplete="off"><button class="btn" type="submit">Send</button></form>
    </div>`;
  },
  map(){
    const mine = new Set(myShifts().map(x=>x[3]));
    return `<div class="view">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Posts</h2><label class="sub" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="guestLayer" ${state.guest!==false?"checked":""}> Guest parking &amp; trolley</label></div>
      <div class="zoombtns"><button class="btn" type="button" data-placepin="1" id="placeBtn">${placing ? "Tap the map to place…" : "Place pin"}</button><a class="btn ghost" style="text-decoration:none" href="https://www.google.com/maps/@41.4815,-71.3150,14z/data=!5m1!1e1" target="_blank" rel="noopener">Live traffic</a><button class="btn ghost" type="button" data-zoom="fort">Fort Adams</button><button class="btn ghost" type="button" data-zoom="town">Bellevue Ave posts</button><button class="btn ghost" type="button" data-zoom="all">Everything</button></div>
      <div class="mapbox"><div id="smap" role="application" aria-label="Map of staff posts"></div></div>
      <div class="sub">Pinch to zoom to street level. Use Place pin to drop meeting points, hazards, vehicles or notes. Pin colour = team stationed there. Dashed ring = your posts. Fort Adams post positions are sample placements until Ops sets the site plan.</div>
      <h2>My posts</h2>
      <div class="list">${Object.entries(POSTS).filter(([k])=>mine.has(k)).map(([k,p])=>`<div class="item" style="grid-template-columns:minmax(0,1fr) auto"><div><div class="ti">${esc(p.name)}</div><div class="sub">${esc(p.where)}</div></div><button class="btn ghost" type="button" data-flypost="${k}" style="padding:7px 10px">Locate</button></div>`).join("") || `<div class="item"><div class="sub">No posts assigned.</div></div>`}</div>
    </div>`;
  },
  team(){
    const vt = state.viewTeam;
    return `<div class="view">
      <h2>Team designations</h2>
      <div class="teams">${Object.entries(TEAMS).map(([k,t])=>`<button type="button" class="team" style="--c:${t.c}" data-viewteam="${k}" aria-pressed="${vt===k}"><span class="n">${esc(t.name)}</span><span class="sub">${t.size} people · ${t.radio}</span><span class="sub">Base: ${esc(POSTS[t.base].name)}</span>${k===state.team?`<span class="pill" style="background:${t.c};color:#0c1524;align-self:flex-start">Your team</span>`:""}</button>`).join("")}</div>
      ${vt ? `<section style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>${esc(TEAMS[vt].name)} roster</h2><span class="btns"><button class="btn" type="button" data-ping="team:${vt}" style="padding:7px 12px">Ping team</button><button class="btn ghost" type="button" data-dirs="team:${vt}" style="padding:7px 12px">Directions</button></span></div>
        <div class="list roster">${ROSTER_ROLES.slice(0, Math.min(8, TEAMS[vt].size)).map((r,i)=>`<div class="item" style="--c:${TEAMS[vt].c}"><div class="av">${SAMPLE_NAMES[i].split(" ").map(w=>w[0]).join("")}</div><div><div class="ti">${esc(i===0?TEAMS[vt].lead:SAMPLE_NAMES[i])}</div><div class="sub">${r} · ${esc(POSTS[(SHIFTS[vt]||[[0,0,0,TEAMS[vt].base]])[Math.min(i,(SHIFTS[vt]||[1]).length-1)][3]].name)}</div></div><span class="btns" style="flex-wrap:nowrap"><button class="btn ghost" type="button" data-ping="person:${esc(i===0?TEAMS[vt].lead:SAMPLE_NAMES[i])}" style="padding:7px 10px">Ping</button><button class="btn ghost" type="button" data-dm="${esc(i===0?TEAMS[vt].lead:SAMPLE_NAMES[i])}" style="padding:7px 10px">Message</button></span></div>`).join("")}</div>
        <div class="sub">Showing ${Math.min(8,TEAMS[vt].size)} of ${TEAMS[vt].size}. Names are placeholders.</div></section>` : `<div class="notice">Tap a team to see its roster, posts and radio channel.</div>`}
    </div>`;
  },
  alerts(){
    $("#alertDot").hidden = true;
    return `<div class="view">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Pings &amp; directions</h2><span class="btns"><button class="btn" type="button" data-ping="team:${state.team}">Ping</button><button class="btn ghost" type="button" data-dirs="1">Send directions</button></span></div>
      <div class="list">${state.pings.length ? state.pings.map(pingRow).join("") : `<div class="item" style="grid-template-columns:1fr"><div class="sub">No pings yet. Ping a person, a team or everyone at a post; their replies show here.</div></div>`}</div>
      <button class="btn ghost" type="button" data-simin="1" style="align-self:flex-start">Simulate an incoming ping (demo)</button>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Dispatch alerts</h2><button class="btn" type="button" data-compose="1">Send alert</button></div>
      <div class="list">${state.alerts.map(a=>`<div class="alert ${a.lvl}${a.ack?" done":""}"><div class="bar"></div><div style="display:flex;flex-direction:column;gap:6px"><div class="sub">${a.lvl==="urgent"?`<span class="pill" style="background:var(--urgent);color:#fff">Urgent</span> `:""}${a.t} · to ${esc(a.to)}</div><div class="ti">${esc(a.txt)}</div>${a.ack?`<div class="sub">Acknowledged</div>`:`<div><button class="btn ok" type="button" data-ack="${a.id}" style="padding:7px 12px">Acknowledge</button></div>`}</div></div>`).join("")}</div>
      <div class="notice">Shift alerts are automatic: 15 minutes before every post change, with where to go and walking time. Leads and Ops can send to a team, a post or everyone.</div>
    </div>`;
  }
};

function render(){
  document.documentElement.style.setProperty("--team", T().c);
  $("#whoTxt").textContent = isLive() ? (String(LIVE.me.name||"").split(" ")[0] + " \u00b7 " + T().short) : T().short;
  document.querySelectorAll(".tabs button").forEach(b=>{ if(b.dataset.tab===state.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const unack = isLive() ? LIVE.ann.filter(a=>!annAcked().has(a.id)).length : state.alerts.filter(a=>!a.ack).length;
  $("#alertDot").hidden = !unack;
  $("#alertDot").textContent = unack;
  $("#main").innerHTML = views[state.tab]();
  const f = document.getElementById("composeForm"); if(f) f.addEventListener("submit", sendMsg);
  const m = document.getElementById("msgs"); if(m) m.lastElementChild?.scrollIntoView({block:"nearest"});
  if(state.tab==="map") initStaffMap(); else if(smap){ smap.remove(); smap = null; }
  const gl = document.getElementById("guestLayer"); if(gl) gl.addEventListener("change", ()=>{ state.guest = gl.checked; if(smap && guestLayer){ gl.checked ? guestLayer.addTo(smap) : smap.removeLayer(guestLayer); } });
}
function go(t){ state.tab = t; store.set("st.tab",t); render(); window.scrollTo(0,0); }
function now(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function sendMsg(ev){
  ev.preventDefault(); const i = $("#msgIn"); const txt = i.value.trim(); if(!txt) return;
  if(isLive()){ i.value = ""; liveSend(txt); return; }
  (state.msgs[state.chan] = state.msgs[state.chan] || []).push({by:"You", team:state.team, t:now(), txt, me:true});
  store.set("st.msgs", state.msgs); render(); const n = $("#msgIn"); if(n) n.focus();
}
let tt=null; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2600); }
let lastFocus=null;
function gateQrSheet(gk){
  const g = GATES[gk] || GATES.MAIN, payload = "AUDRAIN-CHECKIN:" + g.ev + ":" + gk;
  openSheet("Gate check-in code", `<div class="field"><label class="label" for="gateSel">Gate</label><select id="gateSel">${Object.entries(GATES).map(([k,x])=>`<option value="${k}" ${k===gk?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
    <div style="background:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#003057">
      <div style="font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px">Scan to check in</div>
      <div id="gateQR" aria-label="Check-in QR for ${esc(g.name)}"></div>
      <div style="font-weight:800">${esc(g.name)}</div>
      <div style="font-size:13px">Can't scan? Enter code <b style="font-size:20px;letter-spacing:.2em">${g.code}</b></div>
    </div>
    <div class="sub">Guests open My Tickets, tap Check in, and scan this. Their phone shows a green ADMITTED screen for you to glance at. Print one sign per lane.</div>
    <div class="btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-printgate="1">Print</button><button class="btn" type="button" data-close="1">Done</button></div>`);
  const box = document.getElementById("gateQR");
  if(window.QRCode){ new QRCode(box, {text: payload, width: 220, height: 220, colorDark: "#003057", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M}); }
  else box.textContent = payload;
  const sel = document.getElementById("gateSel"); if(sel) sel.addEventListener("change", ()=>gateQrSheet(sel.value));
}
function openSheet(title, html){ stopScanner(); lastFocus=document.activeElement; $("#sheetTitle").textContent=title; $("#sheetBody").innerHTML=html; $("#scrim").hidden=false; const f=$("#sheetBody button, #sheetBody select"); if(f) f.focus(); }
function closeSheet(){ stopScanner(); $("#scrim").hidden=true; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }


let smap = null, guestLayer = null, placing = false, pinLayer = null;
const PIN_TYPES = {post:["Post","#4a90d9"], meet:["Meeting point","#3fae6b"], hazard:["Hazard / closed","#e0533f"], vehicle:["Vehicle / cart","#DBAB1A"], note:["Note","#9aa7bf"]};
let PINS = (()=>{ try{ return JSON.parse(localStorage.getItem("st.pins")||"[]"); }catch(e){ return []; } })();
const savePins = () => { try{ localStorage.setItem("st.pins", JSON.stringify(PINS)); }catch(e){} };
function drawPins(){
  if(!smap) return; if(pinLayer) smap.removeLayer(pinLayer); pinLayer = L.layerGroup().addTo(smap);
  PINS.forEach((p,i)=>{ const ty = PIN_TYPES[p.type]||PIN_TYPES.note;
    L.marker(p.ll, {icon:L.divIcon({className:"", html:`<div class="pm" style="width:22px;height:22px;border-radius:6px;background:${ty[1]};color:#fff;border-color:#fff">+</div>`, iconSize:null})})
      .bindPopup(`<b>${esc(p.label)}</b><br>${ty[0]} \u00b7 placed ${esc(p.t)} by ${esc(p.by)}<br><button type="button" data-delpin="${i}" style="margin-top:6px">Remove</button>`).addTo(pinLayer); });
}
function postColor(k){ const t = Object.entries(TEAMS).find(([tk,t])=>t.base===k) || Object.entries(TEAMS).find(([tk])=>(SHIFTS[tk]||[]).some(x=>x[3]===k)); return t ? t[1].c : "#8c99b3"; }
function initStaffMap(){
  const el = document.getElementById("smap"); if(!el) return;
  if(!window.L){ el.innerHTML = '<p class="sub" style="padding:16px">The map could not load. Check your connection.</p>'; return; }
  if(smap){ smap.remove(); smap = null; }
  smap = L.map(el, {scrollWheelZoom:false}); smap.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, maxNativeZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(smap);
  const mine = new Set(myShifts().map(x=>x[3]));
  Object.entries(POSTS).forEach(([k,p])=>{
    const c = postColor(k), m = mine.has(k);
    const icon = L.divIcon({className:"", html:`<div class="pm${m?" mine":""}" style="width:26px;height:26px;background:${c}">${esc(p.name.split(" ").map(w=>w[0]).join("").slice(0,2))}</div>`, iconSize:null});
    L.marker(p.ll, {icon, title:p.name}).bindTooltip(p.name, {direction:"top", offset:[0,-14]}).on("click", ()=>showPost(k)).addTo(smap);
  });
  guestLayer = L.layerGroup();
  GUEST.lots.forEach(l=>L.marker(l.ll, {icon:L.divIcon({className:"", html:'<div class="pm guest" style="width:24px;height:24px">P</div>', iconSize:null})}).bindPopup(`<b>Guest parking: ${esc(l.name)}</b><br>${l.hours} \u00b7 free, first come`).addTo(guestLayer));
  GUEST.stops.forEach(st=>L.marker(st.ll, {icon:L.divIcon({className:"", html:'<div class="pm stop">T</div>', iconSize:null})}).bindPopup(`<b>Trolley stop: ${esc(st.name)}</b><br>${esc(GUEST.loop)}`).addTo(guestLayer));
  L.polyline(GUEST.stops.map(x=>x.ll), {color:"#DBAB1A", weight:3, dashArray:"8 6", opacity:.85}).addTo(guestLayer);
  if(state.guest!==false) guestLayer.addTo(smap);
  drawPins();
  smap.on("click", ev=>{ if(state.dropping){ state.dropping = false; state.dropLL = [Number(ev.latlng.lat.toFixed(6)), Number(ev.latlng.lng.toFixed(6))]; if(state.dirDraft) state.dirDraft.dest = "drop"; dirSheet(); return; }
    if(!placing) return; placing = false; const b = document.getElementById("placeBtn"); if(b) b.textContent = "Place pin";
    const ll = [Number(ev.latlng.lat.toFixed(6)), Number(ev.latlng.lng.toFixed(6))];
    openSheet("New pin", `<div class="field"><label class="label" for="pinLabel">Name</label><input id="pinLabel" placeholder="e.g. Water station 2"></div>
      <div class="field"><label class="label" for="pinType">Type</label><select id="pinType">${Object.entries(PIN_TYPES).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("")}</select></div>
      <div class="sub">${ll[0]}, ${ll[1]}</div>
      <div class="btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close="1">Cancel</button><button class="btn" type="button" data-savepin="${ll.join(",")}">Save pin</button></div>`); });
  zoomTo(mine.size && [...mine].every(k=>POSTS[k].sample) ? "fort" : "all");
  setTimeout(()=>smap && smap.invalidateSize(), 60);
}
function zoomTo(which){
  if(!smap) return;
  const pts = Object.values(POSTS).filter(p=> which==="all" ? true : which==="fort" ? p.sample : !p.sample).map(p=>p.ll);
  if(which==="all") GUEST.stops.forEach(x=>pts.push(x.ll));
  smap.fitBounds(L.latLngBounds(pts).pad(which==="fort" ? 0.25 : 0.15));
}

// ---------- Pings and directions (demo: local only; real delivery needs a backend and push notifications)
const people = k => { const t = TEAMS[k]; return [t.lead, ...SAMPLE_NAMES.slice(1, Math.min(8, t.size))]; };
function parseTo(v){ const [kind, key] = v.split(/:(.+)/);
  if(kind==="person") return {kind, key, label:key, rec:[key]};
  if(kind==="team") return {kind, key, label:TEAMS[key].name, rec:people(key).slice(0,3)};
  if(kind==="post") { const ts = Object.entries(TEAMS).filter(([tk,t])=>t.base===key || (SHIFTS[tk]||[]).some(x=>x[3]===key)); return {kind, key, label:"Everyone at " + POSTS[key].name, rec: ts.length ? ts.map(([tk,t])=>t.lead) : ["Ops Desk"]}; }
  return {kind:"all", key:"all", label:"All staff", rec:Object.values(TEAMS).map(t=>t.lead)}; }
function toSelect(sel){
  if(isLive()) return liveToSelect(sel);
  const o = [["team:"+state.team, "My team ("+T().name+")"], ["all:all", "Everyone on staff"]]
    .concat(Object.entries(TEAMS).filter(([k])=>k!==state.team).map(([k,t])=>["team:"+k, "Team: "+t.name]))
    .concat(Object.entries(POSTS).map(([k,p])=>["post:"+k, "Everyone at "+p.name]))
    .concat(people(state.team).map(n=>["person:"+n, n]));
  if(sel && !o.some(x=>x[0]===sel) && sel.startsWith("person:")) o.unshift([sel, sel.slice(7)]);
  return `<select id="pTo">${o.map(([v,l])=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
}
const curPost = () => { const c = nowNext().cur; return c ? c[3] : T().base; };
const postSelect = (id, sel) => `<select id="${id}">${Object.entries(POSTS).map(([k,p])=>`<option value="${k}" ${k===sel?"selected":""}>${esc(p.name)}</option>`).join("")}</select>`;
function stClass(x){ return x==="On my way" ? "go" : x==="Done" ? "done" : x==="Can't" ? "no" : ""; }
function pingRow(p){
  const chips = Object.entries(p.status||{}).map(([n,v])=>`<span class="stc ${stClass(v)}">${esc(n)}: ${esc(v)}</span>`).join("");
  return `<div class="item" style="grid-template-columns:minmax(0,1fr) auto"><div><div class="sub">${p.dir==="in" ? "From " + esc(p.from) : "To " + esc(p.toLabel)} \u00b7 ${p.t}${p.type==="dir" ? " \u00b7 directions" : ""}</div><div class="ti">${esc(p.msg)}</div>${p.note?`<div class="sub">${esc(p.note)}</div>`:""}<div>${chips}${p.dir==="in" && p.reply ? `<span class="stc ${stClass(p.reply)}">You: ${esc(p.reply)}</span>` : ""}</div></div>${p.type==="dir" ? `<button class="btn ghost" type="button" data-opendir="${p.id}" style="padding:7px 10px">Open map</button>` : ""}</div>`;
}
function savePings(){ store.set("st.pings", state.pings.slice(0,60)); }
function simulateAcks(p){
  p.rec.forEach((n,i)=>setTimeout(()=>{
    const v = p.msgKey==="clear" ? "Done" : (i===2 ? "Can't" : "On my way");
    p.status[n] = v; savePings(); toast(n + ": " + v);
    if(state.tab==="alerts") render(); }, 1600 + i*900));
}
function pingSheet(pre){
  openSheet("Ping", `<div class="field"><label class="label" for="pTo">To</label>${toSelect(pre)}</div>

let destMarker = null;
function haversine(a, b){ const R = 6371000, r = x => x*Math.PI/180, dLa = r(b[0]-a[0]), dLo = r(b[1]-a[1]); const h = Math.sin(dLa/2)**2 + Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function openDir(id){

    document.getElementById("smap").scrollIntoView({behavior:"smooth", block:"center"});
    try{ navigator.geolocation && navigator.geolocation.getCurrentPosition(pos=>{ const m = haversine([pos.coords.latitude,pos.coords.longitude], p.dest.ll); const el = document.getElementById("dDist"); if(el) el.textContent = m<1000 ? `About ${Math.round(m)} m away (${Math.max(1,Math.round(m/80))} min walk)` : `About ${(m/1000).toFixed(1)} km away`; }, ()=>{}, {timeout:5000}); }catch(e){}
  }, 120);
}

function domainOk(email){ const d = (email.split("@")[1]||"").toLowerCase(); return STAFF_DOMAINS.some(x=>d===x || d.endsWith("."+x)); }

let creating = false;
async function doAuth(create){
  const email = ($("#gEmail").value||"").trim().toLowerCase(), pw = $("#gPass").value||"", err = $("#gErr");
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent = "Enter your work email."; return; }
  if(!domainOk(email)){ err.textContent = "Use your work email."; return; }
  if(pw.length < 8){ err.textContent = "Password must be at least 8 characters."; return; }
  if(create && !($("#gName").value||"").trim()){ err.textContent = "Add your name."; $("#gName").focus(); return; }
  if(!window.SB){ err.textContent = "Can't reach the sign-in service. Check your connection."; return; }
  await SB.ready;
  if(!SB.ok){ err.textContent = "Can't reach the sign-in service. Check your connection."; return; }
  err.textContent = create ? "Creating your account\u2026" : "Signing in\u2026";

    if(create) await SB.signUp(email, pw); else await SB.signIn(email, pw);

let SCAN = null;
function loadJsQR(){ return new Promise(res=>{ if(window.jsQR) return res(true); const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"; sc.onload = ()=>res(true); sc.onerror = ()=>res(false); document.head.appendChild(sc); }); }
function openScanner(mode){
  const titles = {ticket:"Scan tickets", lanyard:"Scan the lanyard", lyticket:"Scan the guest's ticket"};
  openSheet(titles[mode], `<div class="scanbox"><video id="scanVid" playsinline muted></video><div class="scanframe"></div></div>
    <div class="sub" id="scanMsg" role="status">Starting camera…</div>
    ${mode==="ticket" ? `<div class="sub">${esc((GATES[state.gate]||GATES.MAIN).name)} · ${isLive() ? "live" : "demo"}</div>` : ""}
    <div class="btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close="1">${mode==="ticket" ? "Stop scanning" : "Cancel"}</button></div>`);
  SCAN = {mode, stream:null, timer:null, busy:false, last:"", lastAt:0};
  startCamera();
}
async function startCamera(){
  const msg = t => { const m = document.getElementById("scanMsg"); if(m) m.textContent = t; };
  const me = SCAN;
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no camera");
    const st = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false});
    if(SCAN!==me){ st.getTracks().forEach(t=>t.stop()); return; }
    me.stream = st; const v = document.getElementById("scanVid"); if(!v) return stopScanner();
    v.srcObject = st; await v.play();
    const det = ("BarcodeDetector" in window) ? new BarcodeDetector({formats:["qr_code"]}) : null;
    if(!det) await loadJsQR();
    const cv = document.createElement("canvas"), cx = cv.getContext("2d", {willReadFrequently:true});
    msg("Point at the QR code…");
    me.timer = setInterval(async ()=>{
      if(SCAN!==me || me.busy || !v.videoWidth) return;
      try{
        let txt = null;
        if(det){ const r = await det.detect(v); if(r.length) txt = r[0].rawValue; }
        else if(window.jsQR){ cv.width = v.videoWidth; cv.height = v.videoHeight; cx.drawImage(v,0,0); const d = cx.getImageData(0,0,cv.width,cv.height); const r = jsQR(d.data, d.width, d.height); if(r) txt = r.data; }
        if(txt && !(txt===me.last && Date.now()-me.lastAt<4000)){ me.last = txt; me.lastAt = Date.now(); onScanned(txt); }
      }catch(e){}
    }, 300);
  }catch(e){ msg("The camera isn't available here. Paste the code on the Gate tab instead."); }
}

  const mode = SCAN.mode;

  if(qty<1 || qty>20){ toast("Choose 1 to 20 tickets"); return; }
  if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast("Check the email"); return; }
  btn.disabled = true;
  try{ const r = await SB.rpc("tix", "door_sale", {p_app:APP, p_ticket_type_id:$("#dsType").value, p_qty:qty, p_email:email||null, p_payment_method:$("#dsPay").value, p_payment_ref:($("#dsRef").value||"").trim()||null, p_buyer_name:($("#dsName").value||"").trim()||null});
    claimSheet("Door sale: " + qty + " ticket" + (qty===1?"":"s"), r.tickets, email||null); }
  catch(e){ btn.disabled = false; toast(e.message); }
}

// Lanyard pickup (staff and up): link a stocked lanyard to the guest's virtual ticket
function lyResults(){
  const r = state.ly.results; if(!r) return "";
  if(!r.length) return `<div class="sub">No matching tickets.</div>`;
  return `<div class="list">${r.map(t=>`<label class="item" style="grid-template-columns:auto minmax(0,1fr)"><input type="radio" name="lySel" value="${t.id}" ${t.lanyard?"disabled":""} ${r.length===1&&!t.lanyard?"checked":""}><div><div class="ti">${esc(t.holder || t.type || "Ticket")} · ${esc(t.serial)}</div><div class="sub">${esc(t.event||"")}${t.owner_email ? " · " + esc(t.owner_email) : t.waiting_for ? " · waiting for " + esc(t.waiting_for) : ""}${t.lanyard ? " · has lanyard " + esc(t.lanyard) : ""}</div></div></label>`).join("")}</div>`;
}
function lanyardSheet(autoFind){
  const ly = state.ly;
  openSheet("Lanyard pickup", `<div class="field"><label class="label" for="lyIn">1. Lanyard</label><div style="display:flex;gap:8px"><input id="lyIn" value="${esc(ly.lanyard)}" placeholder="Lanyard serial" autocomplete="off" style="flex:1;min-width:0"><button class="btn ghost" type="button" data-scanmode="lanyard">Scan</button></div></div>
    <div class="field"><label class="label" for="lyQ">2. Guest's ticket</label><div style="display:flex;gap:8px"><input id="lyQ" value="${esc(ly.q)}" placeholder="Email or ticket serial" autocomplete="off" style="flex:1;min-width:0"><button class="btn ghost" type="button" data-lyfind="1">Find</button><button class="btn ghost" type="button" data-scanmode="lyticket">Scan phone</button></div></div>
    <div id="lyRes">${lyResults()}</div>
    <div class="btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close="1">Close</button><button class="btn" type="button" data-lylink="1">Link lanyard</button></div>`);
  if(autoFind) lyFind();
}
async function lyFind(){
  const q = ($("#lyQ").value||"").trim(); state.ly.q = q;
  if(q.length<3){ toast("Type at least 3 characters"); return; }
  try{ state.ly.results = await SB.rpc("tix", "staff_find_tickets", {p_app:APP, p_q:q}); const el = document.getElementById("lyRes"); if(el) el.innerHTML = lyResults(); }
  catch(e){ toast(e.message); }
}
async function lyLink(){
  const lan = parseLanyard($("#lyIn").value), sel = document.querySelector('input[name="lySel"]:checked');
  if(!lan){ toast("Scan or type the lanyard first"); return; }
  if(!sel){ toast("Find and pick the guest's ticket"); return; }
  try{ const r = await SB.rpc("tix", "link_lanyard", {p_app:APP, p_lanyard_serial:lan, p_ticket_id:sel.value}); state.ly = {lanyard:"", q:"", results:null}; closeSheet(); toast("Lanyard " + r.lanyard + " linked. It now scans as their ticket."); }
  catch(e){ toast(e.message); }
}
state.ly = {lanyard:"", q:"", results:null};

    const apply = kind==="apply";

      <div class="btns" style="justify-content:flex-end"><button class="btn" type="button" data-close="1">Done</button></div>`);

async function admGo(kind, btn){
  const qty = Math.floor(Number($("#cmQty").value)||0), email = ($("#cmEmail").value||"").trim(), who2 = ($("#cmWho").value||"").trim(), why = ($("#cmWhy").value||"").trim();
  if(qty<1 || qty>50){ toast("Choose 1 to 50"); return; }
  if(why.length<3){ toast("A reason is required"); return; }
  if((kind==="apply" || email) && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast("Enter the guest's email"); return; }
  btn.disabled = true;
  try{
    if(kind==="comp"){ const r = await SB.rpc("tix", "issue_comp", {p_app:APP, p_ticket_type_id:$("#cmType").value, p_qty:qty, p_reason:why, p_recipient:who2||null, p_email:email||null}); claimSheet("Comps issued", r.tickets, email||null); }
    else { const r = await SB.rpc("tix", "admin_apply", {p_app:APP, p_ticket_type_id:$("#cmType").value, p_qty:qty, p_target_email:email, p_reason:why, p_holder:who2||null});
      if(r.on_phone_now){ closeSheet(); toast(qty + " ticket" + (qty===1?"":"s") + " applied to " + email + ". They're on the phone now."); }
      else claimSheet("Applied: waiting for sign-in", r.tickets, email, "Nobody has signed in with that email yet. The tickets load when they do, or they can scan these codes once."); }
  }catch(e){ btn.disabled = false; toast(e.message); }
}

const ACT = {move:["Move to another ticket type","Move"], unlock_phone:["Move to a new phone","Issue new code"], remove:["Remove this ticket","Remove"], refund:["Refund this ticket","Refund"]};
async function actSheet(id, act){
  const t = (LIVE.found||[]).find(x=>x.id===id); if(!t) return;
  let types = ""; if(act==="move"){ try{ types = await typeOptions(); }catch(e){ toast(e.message); return; } }
  openSheet(ACT[act][0], `<div class="sub">${esc(t.serial)} · ${esc(t.type||"")} · ${esc(t.owner_email || t.waiting_for || "not on a phone")}</div>
    ${act==="move" ? `<div class="field"><label class="label" for="aType">New ticket type</label><select id="aType">${types}</select></div>` : ""}
    <div class="field"><label class="label" for="aReason">Reason (required, logged)</label><input id="aReason" autocomplete="off"></div>
    <div class="sub">${act==="refund" ? "The ticket stops scanning now. Card refunds go through the payment account once it is live; door and comp tickets have nothing to send back." : act==="unlock_phone" ? "The ticket comes off the old phone and you get a new one-time code for the guest to scan." : act==="remove" ? "The ticket stops scanning now. This can't be undone from the app." : "The ticket keeps its serial; only its type changes."}</div>
    <div class="btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close="1">Cancel</button><button class="btn ${act==="move"?"":"danger"}" type="button" data-aactgo="${id}|${act}">${ACT[act][1]}</button></div>`);
}
async function actGo(id, act, btn){
  const reason = ($("#aReason").value||"").trim(); if(reason.length<3){ toast("A reason is required"); return; }
  btn.disabled = true;
  try{
    const r = act==="refund" ? await SB.rpc("tix", "refund_ticket", {p_ticket_id:id, p_reason:reason})
      : await SB.rpc("tix", "admin_change", {p_ticket_id:id, p_action:act, p_reason:reason, p_new_ticket_type_id: act==="move" ? $("#aType").value : null});
    LIVE.found = null;
    if(act==="unlock_phone" && r.claim_token){ claimSheet("New phone code", [r], null, "The old phone no longer has this ticket. The guest scans this once on the new phone."); return; }
    closeSheet(); toast(act==="refund" ? "Refunded. It no longer scans." : act==="remove" ? "Removed. It no longer scans." : "Moved to " + (r.type||"the new type"));
  }catch(e){ btn.disabled = false; toast(e.message); }
}
async function rosterSave(uid){
  const g = a => document.querySelector(`[data-${a}="${uid}"]`);
  const patch = {role:g("rrole").value, team:g("rteam").value || null, active:g("ractive").checked};
  if(LIVE.me.can_override) patch.can_override = g("rover").checked;
  try{ await SB.update("staff", "members", {user_id:uid, app:APP}, patch); LIVE.roster = await SB.select("staff", "members", q=>q.eq("app",APP).order("name")); toast("Saved"); }catch(e){ toast(e.message); }
}

document.addEventListener("click", ev=>{
  const t = ev.target.closest("button"); if(!t) return; const ds = t.dataset;
  if(ds.signin){ closeSheet(); showGate(); return; }
  if(ds.lchan){ state.lchan = ds.lchan; render(); return; }
  if(ds.lthread){ const owner = ds.lthread.slice(3).split(":")[0]; state.extraChans = (state.extraChans||[]).filter(x=>x[0]!==ds.lthread).concat([[ds.lthread, "Ops: " + whoName(owner)]]); state.lchan = ds.lthread; render(); return; }
  if(ds.ldm){ const ch = dmThread(LIVE.uid, ds.ldm); state.extraChans = (state.extraChans||[]).filter(x=>x[0]!==ch).concat([[ch, whoName(ds.ldm)]]); state.lchan = ch; go("chat"); return; }
  if(ds.lreply){ const [id, v] = ds.lreply.split("|"); liveReply(id, v); return; }
  if(ds.lopendir){ liveOpenDir(ds.lopendir); return; }
  if(ds.scanmode){ if(document.getElementById("lyIn")) state.ly.lanyard = $("#lyIn").value; if(document.getElementById("lyQ")) state.ly.q = $("#lyQ").value; openScanner(ds.scanmode); return; }
  if(ds.resnext){ nextGuest(); return; }
  if(ds.syncscans){ flushScans(); return; }
  if(ds.doorsale){ doorSheet(); return; }
  if(ds.dosale){ doDoorSale(t); return; }
  if(ds.claimnav){ CLAIM.i = Math.max(0, Math.min(CLAIM.tickets.length-1, CLAIM.i + Number(ds.claimnav))); paintClaim(); return; }
  if(ds.lanyard){ lanyardSheet(); return; }
  if(ds.lyfind){ lyFind(); return; }
  if(ds.lylink){ lyLink(); return; }
  if(ds.adm){ admSheet(ds.adm); return; }
  if(ds.admgo){ admGo(ds.admgo, t); return; }
  if(ds.aact){ const [id, a] = ds.aact.split("|"); actSheet(id, a); return; }
  if(ds.aactgo){ const [id, a] = ds.aactgo.split("|"); actGo(id, a, t); return; }
  if(ds.rsave){ rosterSave(ds.rsave); return; }
});

  if(ds.ping){ pingSheet(ds.ping==="1" ? null : ds.ping); return; }
  if(ds.sendping){ sendPing(); return; }
  if(ds.dirs){ state.dirDraft = null; dirSheet(ds.dirs==="1" ? null : ds.dirs); return; }
  if(ds.dropdir){ state.dirDraft = {to: $("#pTo").value, note: $("#dNote").value}; state.dropping = true; closeSheet(); if(state.tab!=="map") go("map"); toast("Tap the map where they should go"); setTimeout(()=>{ const m = document.getElementById("smap"); if(m) m.scrollIntoView({behavior:"smooth", block:"center"}); }, 150); return; }
  if(ds.senddir){ sendDir(); return; }
  if(ds.opendir){ openDir(ds.opendir); return; }
  if(ds.simin){ simulateIncoming(); return; }
  if(ds.reply){ const [id, v] = ds.reply.split("|"); const p = state.pings.find(x=>x.id==id); if(p){ p.reply = v; savePings(); } $("#pingBan").hidden = true; toast("Replied: " + v); if(state.tab==="alerts") render(); return; }
  if(ds.signout){ signOut(); return; }
  if(ds.gateqr){ gateQrSheet(ds.gateqr); return; }
  if(ds.printgate){ try{ window.print(); }catch(e){} return; }
  if(ds.close){ closeSheet(); return; }
  if(t.id==="whoBtn"){ whoSheet(); return; }
  if(ds.pickteam){ state.team = ds.pickteam; store.set("st.team",state.team); state.day=null; closeSheet(); toast("Now viewing as " + T().name); render(); return; }
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && !$("#scrim").hidden) closeSheet(); if((ev.key==="Enter"||ev.key===" ") && ev.target.matches && ev.target.matches("g[data-showpost]")){ ev.preventDefault(); showPost(ev.target.dataset.showpost); } });
$("#scrim").addEventListener("click", ev=>{ if(ev.target.id==="scrim") closeSheet(); });
if(!views[state.tab]) state.tab="shift";
$("#gateForm").addEventListener("submit", signIn);
$("#gShow").addEventListener("change", ev=>{ $("#gPass").type = ev.target.checked ? "text" : "password"; });
$("#gForgot").addEventListener("click", ()=>{ $("#gErr").textContent = "Ask an admin or Ops to reset your password."; });
$("#gCreate").addEventListener("click", ()=>{ const row = $("#gNameRow"); if(row.hidden){ row.hidden = false; creating = true; $("#gSubmit").hidden = true; $("#gCreate").textContent = "Create account"; $("#gPass").autocomplete = "new-password"; $("#gName").focus(); return; } doAuth(true); });
$("#gBack").addEventListener("click", ()=>{ $("#gate").hidden = true; $("#appRoot").hidden = false; render(); });
if(!STAFF_LOCK && !state.session){ state.session = {email:"staff@audrainconcours.com", name:"Staff", at:Date.now()}; }
if(STAFF_LOCK) showGate(); else enterApp();
// A real staff session from an earlier visit goes live on its own. STAFF_LOCK=true lets nobody in without one.
if(window.SB) SB.ready.then(async ()=>{
  if(!(SB.ok && SB.user && !SB.user.is_anonymous)) return;
  try{ await goLive(); if(STAFF_LOCK) enterApp(); else render(); }catch(e){ console.warn("[staff] live sign-in failed:", e.message); }
});
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
