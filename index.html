<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Audrain">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Audrain Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first app shell - sticky header with event switcher and alerts bell, one scrolling view, fixed five-tab bar. Centered 480px column on wider screens. */
:root{
  --navy:#0f2340; --gold:#b8913a; --gold-soft:#e9dcbc;
  --ivory:#f7f3ea; --card:#fffdf8; --ink:#14213a; --muted:#5d6678; --line:#e3dccb;
  --ok:#2f7d4f; --warn:#b26a12; --full:#a33a2b;
  --bg:var(--ivory); --fg:var(--ink); --surface:var(--card); --bar:var(--navy); --bar-fg:#f3ead6; --btn:var(--navy); --btn-fg:#f7f0de;
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1628; --fg:#ece5d4; --surface:#13223a; --line:#26375a; --muted:#9aa6bd;
  --bar:#07101e; --bar-fg:#efe4c8; --gold-soft:#e9dcbc; --btn:var(--gold); --btn-fg:#16120a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1628; --fg:#ece5d4; --surface:#13223a; --line:#26375a; --muted:#9aa6bd;
  --bar:#07101e; --bar-fg:#efe4c8; --gold-soft:#e9dcbc; --btn:var(--gold); --btn-fg:#16120a; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg);padding:12px 16px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.01em;min-width:0}
.mark small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.tools{display:flex;gap:8px;flex:0 0 auto}
.iconbtn{position:relative;border:1px solid rgba(233,220,188,.4);background:transparent;color:var(--bar-fg);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.iconbtn svg{width:18px;height:18px}
.badge{position:absolute;top:-4px;right:-4px;background:var(--gold);color:#16120a;border-radius:999px;font-size:10px;font-weight:800;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.switch{display:flex;gap:6px;margin-top:12px}
.switch button{flex:1;border:1px solid rgba(233,220,188,.3);background:transparent;color:var(--bar-fg);border-radius:10px;padding:8px 6px;font-size:13px;font-weight:600}
.switch button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#16120a}

main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:20px}
.notice{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;color:var(--fg)}
h1{font-size:30px;line-height:1.08}
h2{font-size:21px}
h3{font-size:17px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.hero{position:relative;border-radius:16px;overflow:hidden;color:#f7f0de;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;background:var(--navy) url("photos/field.jpg") center 30%/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,35,64,.05) 20%,rgba(15,35,64,.92) 85%)}
.hero > *{position:relative}
.hero h1{color:#fbf5e6}
.hero p{margin:6px 0 0;color:#e2dac6;font-size:14px}
.stats{display:flex;gap:18px;font-size:12px;color:#e2dac6;margin-top:10px}
.stats b{display:block;font-family:var(--display);font-size:20px;color:#fbf5e6}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.link{background:none;border:0;padding:0;color:var(--gold);font-weight:600;font-size:13px}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.time{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;padding-top:2px}
.time span{display:block;font-size:11px;color:var(--muted)}
.info{min-width:0;display:flex;flex-direction:column;gap:4px}
.title{font-weight:600;line-height:1.3}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.chip{font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:999px;padding:2px 8px;border:1px solid var(--line);display:inline-block}
.chip.lange{border-color:var(--gold);color:var(--gold)}
.chip.booked{background:var(--ok);border-color:var(--ok);color:#fff}
.dot{display:inline-flex;align-items:center;gap:5px}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.few::before{background:var(--warn)} .dot.full::before{background:var(--full)}
.actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mini{display:flex;gap:2px}
.save{background:none;border:0;padding:3px;line-height:1;color:var(--muted);display:grid;place-items:center}
.save svg{width:20px;height:20px}
.save[aria-pressed="true"]{color:var(--gold)}
.buy{display:inline-block;text-decoration:none;background:var(--btn);color:var(--btn-fg);border:0;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap;text-align:center}
.buy.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.price{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:center;min-width:58px}
.days button b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.days button span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#f7f0de}
.days button[aria-pressed="true"] span{color:var(--gold-soft)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#f7f0de}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:7px 10px;font-size:13px;font:inherit;font-size:13px}
.daylabel{font-family:var(--display);font-size:18px;font-weight:700;margin:2px 0 -2px}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .t{font-weight:700;line-height:1.25}
.card .d{font-size:12.5px;color:var(--muted);flex:1}
.card .p{font-family:var(--display);font-size:19px}

.mapbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.mapbox > svg{display:block;width:100%;height:auto}
.leaflet-attribution-flag{display:none!important}
.venue{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.addr{font-size:12.5px;color:var(--muted)}

.wallet{display:flex;flex-direction:column;gap:10px}
.tk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--surface);border-radius:12px;padding:12px;text-align:left;width:100%}
.tk .t{font-weight:700}
.tk .s{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tk[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.ticket{background:var(--navy);color:#f3ead6;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.ticket .tn{font-family:var(--display);font-size:22px;color:#fbf5e6}
.ticket .eyebrow{color:var(--gold)}
.qrwrap{background:#fff;border-radius:12px;padding:10px;position:relative}
.qrwrap canvas{display:block;width:196px;height:196px;image-rendering:pixelated}
.sample{position:absolute;left:0;right:0;top:44%;transform:rotate(-14deg);font-weight:800;letter-spacing:.2em;color:rgba(163,58,43,.85);font-size:20px;pointer-events:none}
.serial{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--gold-soft)}
.timer{font-size:12px;color:#d6cdb6}
.walletbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.walletbtns span{font-size:12px;border:1px solid rgba(233,220,188,.4);border-radius:8px;padding:6px 10px;color:#f3ead6}

.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ph{margin:0;position:relative;border-radius:12px;overflow:hidden;background:var(--line);aspect-ratio:4/5;max-width:100%}
.ph.wide{grid-column:span 2;aspect-ratio:3/2}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;font-size:12px;color:#fbf5e6;background:linear-gradient(180deg,transparent,rgba(10,20,36,.85))}
.ph .st{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--gold);color:#16120a}
.upload{border:1.5px dashed var(--gold);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;background:var(--surface)}
.upload label{background:var(--btn);color:var(--btn-fg);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.upload input:focus-visible + label{outline:2px solid var(--gold);outline-offset:2px}

.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:#4a3a14}
.alert .ic svg{width:16px;height:16px}
.alert .w{font-size:11.5px;color:var(--muted)}
.pref{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sw{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--ok)} .sw:checked::after{left:21px}

.empty{border:1px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted)}
.empty h2{color:var(--fg)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{background:none;border:0;color:#9fa9bd;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:4px 2px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--gold)}

.scrim{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:480px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet p{margin:0}
.sheetfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px}
.qty output{font-family:var(--mono);font-size:16px;min-width:20px;text-align:center}
.pay{background:#000;color:#fff;border:0;border-radius:10px;padding:11px;font-weight:700;width:100%}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fbf5e6;border:1px solid var(--gold);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;z-index:10;max-width:calc(100% - 32px)}
.badgecard{align-self:center;width:230px;max-width:100%;background:#fffdf8;color:#14213a;border-radius:14px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(10,20,40,.18);overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center}
.badgecard .slot{width:46px;height:8px;border-radius:6px;background:#d8d1c0;margin:10px 0 6px}
.badgecard .band{width:100%;background:#0f2340;color:#e9dcbc;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:6px}
.badgecard .nm{font-family:var(--display);font-size:22px;font-weight:700;margin:12px 10px 2px;color:#14213a}
.badgecard .tier{font-size:12px;font-weight:700;color:#8a6a24;letter-spacing:.08em;text-transform:uppercase}
.badgecard canvas{width:120px;height:120px;image-rendering:pixelated;margin:10px 0 4px}
.badgecard .sn{font-family:var(--mono);font-size:11.5px;color:#14213a;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field input{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 10px;font:inherit}
#lmap{height:380px;width:100%;background:#dfe7ec}
.leaflet-container{font-family:var(--body)}
.mk{display:grid;place-items:center;border-radius:50%;font:700 12px/1 var(--body);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk-venue{width:28px;height:28px;background:#0f2340;border-color:#b8913a}
.mk-park{width:26px;height:26px;border-radius:6px;background:#2f7d4f}
.mk-stop{width:18px;height:18px;background:#b8913a;font-size:9px}
.mk-ferry{width:24px;height:24px;background:#1f78a8;font-size:10px}
.mk-approx{border-style:dashed}
.leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.4}
.leaflet-popup-content b{font-size:14px}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.layers button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.layers button[aria-pressed="false"]{opacity:.5}
.layers i{width:10px;height:10px;border-radius:50%;display:inline-block}
.loop{display:flex;flex-direction:column;gap:4px;padding:12px;border-top:1px solid var(--line)}
.loop:first-child{border-top:0}
.loop .stops{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.loop .stops span{background:var(--gold-soft);color:#3d3010;border-radius:6px;padding:2px 7px;font-weight:600;font-size:12px}
.shophead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cats button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.cats button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#f7f0de}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pc{border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;min-width:0}
.pc img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#fff;display:block;max-width:100%}
.pc .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.pc .t{font-size:13px;font-weight:600;line-height:1.3}
.pc .p{font-family:var(--display);font-size:16px}
.pimg{width:100%;max-width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#fff}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600;min-width:44px}
.sizes button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#f7f0de}
.sizes button:disabled{opacity:.35;text-decoration:line-through}
.bagline{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bagline img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#fff}
.merch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mi{border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--fg);min-width:0}
.mi img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#fff;display:block;max-width:100%}
.mi .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.mi .t{font-size:13px;font-weight:600;line-height:1.3}
.mi .p{font-family:var(--display);font-size:16px}
.mi .o{font-size:12px;font-weight:700;color:var(--gold)}
.shopall{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--gold);border-radius:12px;padding:12px;text-decoration:none;color:var(--fg);background:var(--surface)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;scroll-behavior:auto!important} }

const CATS = [["hats",/\b(hat|cap|beanie|visor)\b/i,"Hats"],["outer",/\b(jacket|vest|soft shell|fleece)\b/i,"Outerwear"],["tops",/(shirt|tee|polo|sleeve|zip|pullover|crew|hood|sweat)/i,"Tops"],["drink",/\b(mug|tumbler|glass|bottle|cup|koozie)\b/i,"Drinkware"]];
const catOf = p => (CATS.find(c=>c[1].test(p.t)) || ["other",null,"Accessories"])[0];
const catName = k => (CATS.find(c=>c[0]===k) || [0,0,"Accessories"])[2];
const minPrice = p => Math.min(...p.v.filter(v=>v.a).map(v=>v.p));
const DAYS = [...new Set(EVENTS.map(e=>e.d))];
const CAP = {ok:["","Available"], few:["few","Few left"], full:["full","Sold out"]};
const money = n => "$" + (Number.isInteger(n) ? n.toLocaleString("en-US") : n.toFixed(2));
const priceLabel = e => e.kind==="free" ? "Free" : e.kind==="members" ? "Members" : e.kind==="invite" ? "Invitation" : e.kind==="info" ? "" : (typeof e.price==="number" ? (e.from ? "From " : "") + money(e.price) : "Tickets");

const store = {
  get(k,f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
// Wallet starts with one sample pass so the scannable entry is visible on first open.
const START_WALLET = [
  {kind:"pass", ref:"vip2", label:"Two-Day VIP", sub:"Sat & Sun · Fort Adams", serial:"AC27-VIP-004812"},
  {kind:"addon", ref:"park", label:"Reserved parking, Lot B", sub:"Sat & Sun · scanned at the lot", serial:"AC27-PK-001377"}
];
const state = {
  event: store.get("ae.event","motorweek"),
  tab: store.get("ae.tab","home"),
  day: DAYS[0], venue:"all", itinMode: "mine",
  saved: new Set(store.get("ae.saved",["main","supercar","cars-coffee"]).filter(id=>EVENTS.some(e=>e.id===id))),
  wallet: store.get("ae.wallet", START_WALLET),
  open: 0,
  uploads: [],
  prefs: store.get("ae.prefs",{remind:true, changes:true, offers:false, weather:true}),
  seen: store.get("ae.seen", false),
  mapDay: "2026-10-03", layers: {venues:true, parking:true, trolley:true, ferry:true},
  cat: "all", bag: store.get("ae.bag", []), prod: null, size: null
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayParts = d => { const dt = new Date(d+"T12:00:00"); return {wd: dt.toLocaleDateString("en-US",{weekday:"short"}), long: dt.toLocaleDateString("en-US",{weekday:"long", month:"long", day:"numeric"}), n: dt.getDate(), mon: dt.toLocaleDateString("en-US",{month:"short"})}; };
const fmtTime = t => { const [h,m] = t.split(":").map(Number); return {hm: ((h%12)||12)+":"+String(m).padStart(2,"0"), ap: (h>=12&&h<24)?"PM":"AM"}; };
const endLabel = e => { if(!e.e) return ""; const f = fmtTime(e.e); return "Until " + f.hm + " " + f.ap; };
const booked = id => state.wallet.some(w=>w.kind==="event" && w.ref===id);
const saveWallet = () => store.set("ae.wallet", state.wallet);
let serialN = store.get("ae.serialN", 5200);
const newSerial = code => { serialN += 7; store.set("ae.serialN", serialN); return `AC27-${code}-${String(serialN).padStart(6,"0")}`; };

const STAR = on => `<svg viewBox="0 0 24 24" fill="${on?"currentColor":"none"}" stroke="currentColor" stroke-width="1.8"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>`;

function row(e, showDay){
  const tm = fmtTime(e.t), dp = dayParts(e.d), c = CAP[e.cap||"ok"], v = VENUES[e.v], b = booked(e.id), on = state.saved.has(e.id) || b;
  let btn;
  if(b) btn = `<button class="buy ghost" type="button" data-showticket="${e.id}">View ticket</button>`;
  else if(e.kind==="free") btn = e.link ? `<a class="buy ghost" href="${e.link}" target="_blank" rel="noopener">Details</a>` : `<span class="chip">Free</span>`;
  else if(e.kind==="members") btn = `<span class="chip">Members</span>`;
  else if(e.kind==="invite") btn = `<a class="buy ghost" href="${e.link}" target="_blank" rel="noopener">Details</a>`;
  else if(e.kind==="info") btn = `<span class="chip">Info</span>`;
  else if(e.cap==="full") btn = `<button class="buy ghost" type="button" data-wait="${e.id}">Waitlist</button>`;
  else btn = `<button class="buy" type="button" data-buy="${e.id}">Buy</button>`;
  return `<div class="row">
    <div class="time">${tm.hm}<span>${showDay ? dp.wd : tm.ap}</span></div>
    <div class="info">
      <div class="title">${esc(e.title)}</div>
      ${e.presenter ? `<div><span class="chip lange">${/^hosted/.test(e.presenter) ? "Hosted" + esc(e.presenter.slice(6)) : "Presented by " + esc(e.presenter)}</span></div>` : ""}
      <div class="meta">${b ? `<span class="chip booked">Booked</span>` : ""}<span>${esc(e.note || v.short)}</span>${e.e ? `<span>${endLabel(e)}</span>` : ""}${e.kind==="ticketed" ? `<span class="dot ${c[0]}">${c[1]}</span>` : ""}</div>
    </div>
    <div class="actions">
      <button class="save" type="button" data-save="${e.id}" aria-pressed="${on}" aria-label="${on?"Remove from":"Add to"} my itinerary">${STAR(on)}</button>
      ${btn}
      <span class="price">${priceLabel(e)}</span>
    </div>
  </div>`;
}

function winterfest(){
  return `<div class="view"><div class="empty">
    <div class="eyebrow">Winterfest</div>
    <h2>Coming soon</h2>
    <p>The same app runs every Audrain event. Winterfest's schedule, tickets, map and photos appear here when they're announced.</p>
    <button class="buy" type="button" data-notify="winterfest">Alert me when tickets go on sale</button>
  </div></div>`;
}

        : `<div class="empty"><h2>Your itinerary is empty</h2><p>Star events in the full schedule, or buy a ticket, and they appear here by day with reminders.</p><button class="buy" type="button" data-mode="all">Browse all events</button></div>`;
    } else {
      let list = EVENTS.filter(e=>e.d===state.day);

let qrTimer = null;
function drawQR(){
  const c = document.getElementById("qr"); if(!c) return stopQR();
  const w = state.wallet[Math.min(state.open, state.wallet.length-1)];
  const x = c.getContext("2d"), N = 29, slot = Math.floor(Date.now()/15000);
  let s = (slot * 2654435761 + [...w.serial].reduce((a,ch)=>a*31+ch.charCodeAt(0)>>>0,7)) >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  x.fillStyle = "#fff"; x.fillRect(0,0,N,N); x.fillStyle = "#0f2340";
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){ const inF = (i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9); if(!inF && rnd()>.52) x.fillRect(i,j,1,1); }
  const finder = (fx,fy) => { x.fillStyle="#0f2340"; x.fillRect(fx,fy,7,7); x.fillStyle="#fff"; x.fillRect(fx+1,fy+1,5,5); x.fillStyle="#0f2340"; x.fillRect(fx+2,fy+2,3,3); };
  finder(0,0); finder(N-7,0); finder(0,N-7);
  const left = 15 - Math.floor((Date.now()%15000)/1000), t = document.getElementById("qrTimer");
  if(t) t.textContent = `Code refreshes in ${left}s. Screenshots will not scan.`;
}
function drawBadge(){
  const c = document.getElementById("badgeQR"); if(!c) return;
  const w = state.wallet[Math.min(state.open, state.wallet.length-1)], x = c.getContext("2d"), N = 29;
  let s = [...w.serial].reduce((a,ch)=>a*33+ch.charCodeAt(0)>>>0,11) >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  x.fillStyle="#fff"; x.fillRect(0,0,N,N); x.fillStyle="#14213a";
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){ const inF=(i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9); if(!inF && rnd()>.52) x.fillRect(i,j,1,1); }
  [[0,0],[N-7,0],[0,N-7]].forEach(([fx,fy])=>{ x.fillStyle="#14213a"; x.fillRect(fx,fy,7,7); x.fillStyle="#fff"; x.fillRect(fx+1,fy+1,5,5); x.fillStyle="#14213a"; x.fillRect(fx+2,fy+2,3,3); });
}

let lmap = null, mapLayers = {};
function mkIcon(cls, txt, approx){ return L.divIcon({className:"", html:`<div class="mk ${cls}${approx?" mk-approx":""}">${txt||""}</div>`, iconSize:null}); }
function gmaps(q){ return "https://maps.google.com/?q=" + encodeURIComponent(q); }
function initMap(){
  const el = document.getElementById("lmap"); if(!el) return;
  if(!window.L){ el.innerHTML = `<div class="empty" style="height:100%;justify-content:center"><p>The map couldn't load. Check your connection and reopen this tab.</p></div>`; return; }
  if(lmap){ lmap.remove(); lmap = null; }
  lmap = L.map(el, {zoomControl:true, attributionControl:true, scrollWheelZoom:false}); lmap.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  let ok = 0, bad = 0;
  const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(lmap);
  tiles.on("tileload", ()=>ok++); tiles.on("tileerror", ()=>{ bad++; if(bad>6 && !ok){ const n = document.getElementById("mapNote"); if(n) n.textContent = "Street tiles are blocked in this preview. They load in the installed app; pins, parking and trolley lines still show."; } });
  const D = state.mapDay, pts = [];
  mapLayers = {venues:L.layerGroup(), parking:L.layerGroup(), trolley:L.layerGroup(), ferry:L.layerGroup()};
  Object.entries(VENUES).forEach(([k,v])=>{
    const n = EVENTS.filter(e=>e.v===k && e.d===D).length;
    const m = L.marker(v.ll, {icon: mkIcon("mk-venue", n || "", v.approx), title: v.name}).bindPopup(`<b>${esc(v.name)}</b><br>${esc(v.addr)}${v.approx?" (approximate pin)":""}<br>${n} event${n===1?"":"s"} on ${dayParts(D).wd}<br><a href="${gmaps(v.name+", "+v.addr)}" target="_blank" rel="noopener">Directions</a>`);
    m.on("click", ()=>showVenue(k, true)); m.addTo(mapLayers.venues); if(n) pts.push(v.ll);
  });
  LOTS.filter(l=>l.days[D]).forEach(l=>{ const h = l.days[D];
    L.marker(l.ll, {icon: mkIcon("mk-park","P"), title: l.name}).bindPopup(`<b>Parking: ${esc(l.name)}</b><br>${esc(l.addr)}<br>${fmtTime(h[0]).hm} ${fmtTime(h[0]).ap} to ${fmtTime(h[1]).hm} ${fmtTime(h[1]).ap} \u00b7 Free, first come<br><a href="${gmaps(l.addr)}" target="_blank" rel="noopener">Directions</a>`).addTo(mapLayers.parking); pts.push(l.ll); });
  const seen = {};
  TROLLEY.filter(t=>t.d===D).forEach(t=>{
    const geo = t.stops.filter(k=>STOPS[k].ll);
    if(geo.length>1) L.polyline(geo.map(k=>STOPS[k].ll), {color:t.c, weight:4, opacity:.85, dashArray:"8 6"}).addTo(mapLayers.trolley);
    geo.forEach(k=>{ if(seen[k]) { seen[k].push(t); return; } seen[k] = [t]; });
  });
  Object.entries(seen).forEach(([k,ts])=>{ const st = STOPS[k];
    L.marker(st.ll, {icon: mkIcon("mk-stop","T", st.approx), title: st.name}).bindPopup(`<b>Trolley stop: ${esc(st.name)}</b><br>${esc(st.note||"")}<br>${ts.map(t=>`${fmtTime(t.s).hm} ${fmtTime(t.s).ap}\u2013${fmtTime(t.e).hm} ${fmtTime(t.e).ap} loop`).join("<br>")}`).addTo(mapLayers.trolley); pts.push(st.ll); });
  if(FERRY.days.includes(D)) FERRY.from.filter(f=>f.ll).forEach(f=>{ L.marker(f.ll, {icon: mkIcon("mk-ferry","F"), title:f.name}).bindPopup(`<b>Ferry: ${esc(f.name)}</b><br>Sat & Sun service. Tickets via ${FERRY.seller}, code ${FERRY.code}.`).addTo(mapLayers.ferry); pts.push(f.ll); });
  Object.entries(mapLayers).forEach(([k,g])=>{ if(state.layers[k]) g.addTo(lmap); });
  if(pts.length) lmap.fitBounds(L.latLngBounds(pts).pad(0.12)); else lmap.setView([41.482,-71.315], 13);
  setTimeout(()=>lmap && lmap.invalidateSize(), 60);
}

  if(ds.addon){ const a = ADDONS.find(x=>x.id===ds.addon); checkout({kind:"addon", ref:a.id, code:a.code, title:a.t, sub:`${a.use} · add-on`, price:null}); return; }
  if(ds.shop){ openSheet("Buy tickets", `<div class="eyebrow">Passes</div><div class="list">${PASSES.map(p=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div class="info"><div class="title">${p.t}</div><div class="meta">${p.d}</div></div><div class="actions"><button class="buy" type="button" data-buypass="${p.id}">${money(p.price)}</button></div></div>`).join("")}</div>
    <div class="eyebrow">Events</div><div class="list">${EVENTS.filter(e=>e.kind==="ticketed" && e.id!=="spike-pod").map(e=>{const dp=dayParts(e.d),tm=fmtTime(e.t);return `<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div class="info"><div class="title">${esc(e.title)}</div><div class="meta"><span>${dp.wd} ${tm.hm} ${tm.ap}</span><span>${esc(VENUES[e.v].short)}</span></div></div><div class="actions">${e.cap==="full"?`<button class="buy ghost" type="button" data-wait="${e.id}">Waitlist</button>`:`<button class="buy" type="button" data-buy="${e.id}">${priceLabel(e)}</button>`}</div></div>`}).join("")}</div>
    <div class="eyebrow">Add-ons</div><div class="list">${ADDONS.map(a=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div class="info"><div class="title">${a.t}</div><div class="meta">${a.use}</div></div><div class="actions"><button class="buy" type="button" data-addon="${a.id}">Add</button></div></div>`).join("")}</div>
    <div class="eyebrow">Merchandise</div><button type="button" class="shopall" data-go="shop" data-close="1" style="width:100%;text-align:left"><span><b>Concours &amp; Motor Week merch</b><br><span class="price">${PRODUCTS.length} items: hats, polos, jackets, mugs and more</span></span><span class="buy">Shop</span></button>
    <div class="sheetfoot"><button class="buy ghost" type="button" data-close="1">Close</button></div>`); return; }
  if(ds.link){ openSheet("Link a website order", `<p>Bought tickets on the Audrain website? Link the order and every ticket appears here with the same serials as your badge.</p>
    <div class="field"><label for="ordNo" class="price">Order number</label><input id="ordNo" inputmode="numeric" placeholder="e.g. 48213977"></div>
    <div class="field"><label for="ordEmail" class="price">Email used at checkout</label><input id="ordEmail" type="email" placeholder="you@example.com"></div>
    <button class="pay" type="button" data-linkgo="1" style="background:var(--btn);color:var(--btn-fg)">Link order (demo)</button>
    <div class="sheetfoot"><button class="buy ghost" type="button" data-close="1">Cancel</button></div>`); return; }
  if(ds.linkgo){ state.wallet.push({kind:"pass", ref:"ga2", label:"Two-Day General Admission", sub:"Sat & Sun · linked from website", serial:newSerial("WEB")}); saveWallet(); state.open = state.wallet.length-1; closeSheet(); toast("Website order linked. 1 ticket added."); render(); return; }
  if(ds.q){ cart.qty = Math.max(1, Math.min(8, cart.qty + Number(ds.q))); cart.paint(); return; }
  if(ds.pay){ pay(); return; }
  if(ds.close){ closeSheet(); return; }
  if(ds.wait){ const e = EVENTS.find(x=>x.id===ds.wait); openSheet("Join the waitlist", `<p>${esc(e.title)} is full. Join the waitlist and we'll alert you if a seat opens. You'll have 20 minutes to claim it.</p><div class="sheetfoot"><button class="buy ghost" type="button" data-close="1">Not now</button><button class="buy" type="button" data-joinwait="${e.id}">Join waitlist</button></div>`); return; }
  if(ds.joinwait){ closeSheet(); toast("You're on the waitlist. We'll alert you if a seat opens."); return; }
  if(ds.showticket){ const j = state.wallet.findIndex(w=>w.kind==="event" && w.ref===ds.showticket); state.open = Math.max(0,j); go("tickets"); return; }
  if(ds.open){ state.open = Number(ds.open); render(); return; }
  if(ds.venue){ showVenue(ds.venue); return; }
  if(ds.mapday){ state.mapDay = ds.mapday; render(); return; }
  if(ds.layer){ const k = ds.layer; state.layers[k] = !state.layers[k]; t.setAttribute("aria-pressed", state.layers[k]); if(lmap){ state.layers[k] ? mapLayers[k].addTo(lmap) : lmap.removeLayer(mapLayers[k]); } return; }
  if(ds.fly){ const [kind,id] = ds.fly.split(":"); const l = LOTS.find(x=>x.id===id); if(l) flyTo(l.ll, 16); return; }
  if(ds.cat){ state.cat = ds.cat; render(); return; }
  if(ds.product){ state.size = null; productSheet(ds.product); return; }
  if(ds.size){ state.size = Number(ds.size); productSheet(state.prod); return; }
  if(ds.addbag){ const p = PRODUCTS.find(x=>x.h===state.prod), v = p.v.find(x=>x.id===state.size); const ex = state.bag.find(b=>b.id===v.id); if(ex) ex.q++; else state.bag.push({id:v.id, t:p.t, vt:v.t, p:v.p, q:1, img:p.img}); store.set("ae.bag", state.bag); closeSheet(); toast("Added to bag"); render(); return; }
  if(ds.bag){ bagSheet(); return; }
  if(ds.rmbag){ state.bag.splice(Number(ds.rmbag),1); store.set("ae.bag", state.bag); bagSheet(); render(); return; }
  if(ds.notify){ toast("We'll alert you when Winterfest tickets go on sale"); return; }
  if(ds.notifon){ enableNotifications(); return; }
  if(t.id==="alertsBtn"){ alertsSheet(); return; }
  if(t.id==="installBtn"){ install(); return; }
});
document.addEventListener("change", ev=>{
  if(ev.target.id==="venueSel"){ state.venue = ev.target.value; render(); }
  if(ev.target.dataset && ev.target.dataset.pref){ state.prefs[ev.target.dataset.pref] = ev.target.checked; store.set("ae.prefs", state.prefs); }
});
document.addEventListener("keydown", ev=>{
  if(ev.key==="Escape" && !$("#scrim").hidden) closeSheet();
  if((ev.key==="Enter"||ev.key===" ") && ev.target.matches && ev.target.matches("g.pin")){ ev.preventDefault(); showVenue(ev.target.dataset.venue); }
});
$("#scrim").addEventListener("click", ev=>{ if(ev.target.id==="scrim") closeSheet(); });

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt = e; });
function install(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; return; }
  openSheet("Install on your phone", `<p><b>iPhone</b></p><ol><li>Open the app link in Safari.</li><li>Tap the Share button.</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>
  <p><b>Android</b></p><ol><li>Open the app link in Chrome.</li><li>Tap the menu (three dots).</li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>
  <p class="notice">The app then opens full-screen from its own icon, like any other app.</p>
  <div class="sheetfoot"><button class="buy" type="button" data-close="1">Done</button></div>`);
}

if(!views[state.tab]) state.tab = "home";
render();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
