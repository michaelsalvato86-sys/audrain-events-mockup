<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#003057">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Audrain">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Audrain Concours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first app shell - sticky header with logo, cart and alerts, one scrolling view, fixed five-tab bar. Centered 480px column on wider screens. */
:root{
  --navy:#003057; --navy-deep:#00112E; --gold:#DBAB1A; --gold-text:#8A6A0A; --gold-soft:#f3e3ad;
  --ivory:#f7f3ea; --card:#fffdf8; --ink:#14213a; --muted:#5d6678; --line:#e3dccb;
  --ok:#2f7d4f; --warn:#8f530c; --full:#a33a2b; --closed:#4b5466;
  --bg:var(--ivory); --fg:var(--ink); --surface:var(--card); --bar:var(--navy); --bar-fg:#f3ead6; --btn:var(--navy); --btn-fg:#f7f0de;
  --display:"Agdasima", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#001229; --fg:#ece8dc; --surface:#082440; --line:#1c3d63; --gold-text:#DBAB1A; --muted:#a3aec3;
  --bar:#00112E; --bar-fg:#efe4c8; --gold-soft:#e9dcbc; --btn:var(--gold); --btn-fg:#16120a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#001229; --fg:#ece8dc; --surface:#082440; --line:#1c3d63; --gold-text:#DBAB1A; --muted:#a3aec3;
  --bar:#00112E; --bar-fg:#efe4c8; --gold-soft:#e9dcbc; --btn:var(--gold); --btn-fg:#16120a; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}
.skip{position:absolute;left:8px;top:-60px;z-index:30;background:var(--gold);color:#16120a;padding:8px 12px;border-radius:8px;font-weight:700}
.skip:focus{top:8px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg);padding:12px 16px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.04em;text-transform:uppercase;min-width:0;line-height:1.05;display:flex;align-items:center;gap:10px}
.mark small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.mark img{height:32px;width:auto;display:block}
.tools{display:flex;gap:8px;flex:0 0 auto}
.iconbtn{position:relative;border:1px solid rgba(233,220,188,.45);background:transparent;color:var(--bar-fg);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.iconbtn svg{width:18px;height:18px}
.badge{position:absolute;top:-4px;right:-4px;background:var(--gold);color:#16120a;border-radius:999px;font-size:10px;font-weight:800;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}

main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
main:focus{outline:none}
.view{display:flex;flex-direction:column;gap:20px}
.notice{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.warn{font-size:13px;border:1px solid var(--warn);background:rgba(143,83,12,.08);border-radius:10px;padding:8px 10px}
.err{color:var(--full);font-weight:600}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;color:var(--fg);text-transform:uppercase;letter-spacing:.03em}
h1{font-size:36px;line-height:1}
h2{font-size:24px;line-height:1.05}
h3{font-size:17px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text)}
.hero .eyebrow,.banner .eyebrow,.ticket .eyebrow{color:var(--gold)}
.hero{position:relative;border-radius:16px;overflow:hidden;color:#f7f0de;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;background:var(--navy) url("photos/field.jpg") center 30%/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,48,87,.05) 20%,rgba(0,48,87,.92) 85%)}
.hero > *{position:relative}
.hero h1{color:#fbf5e6}
.hero p{margin:6px 0 0;color:#e2dac6;font-size:14px}
.stats{display:flex;gap:18px;font-size:12px;color:#e2dac6;margin-top:10px}
.stats b{display:block;font-family:var(--display);font-size:20px;color:#fbf5e6}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.link{background:none;border:0;padding:0;color:var(--gold-text);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:2px}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.row.two{grid-template-columns:minmax(0,1fr) auto}
.time{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;padding-top:2px}
.time span{display:block;font-size:11px;color:var(--muted)}
.info{min-width:0;display:flex;flex-direction:column;gap:4px}
.title{font-weight:600;line-height:1.3}
.tlink{background:none;border:0;padding:0;text-align:left;font-weight:600;line-height:1.3;color:var(--fg)}
.tlink:hover{text-decoration:underline}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.chip{font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:999px;padding:2px 8px;border:1px solid var(--line);display:inline-block}
.chip.lange{border-color:var(--gold);color:var(--gold-text)}
.chip.booked{background:var(--ok);border-color:var(--ok);color:#fff}
.dot{display:inline-flex;align-items:center;gap:5px}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.few::before{background:var(--warn)} .dot.full::before,.dot.closed::before{background:var(--full)} .dot.soon::before{background:var(--muted)}
.actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.save{background:none;border:0;padding:6px;line-height:1;color:var(--muted);display:grid;place-items:center;min-width:32px;min-height:32px}
.save svg{width:20px;height:20px}
.save[aria-pressed="true"]{color:var(--gold-text)}
.buy{display:inline-block;text-decoration:none;background:var(--btn);color:var(--btn-fg);border:0;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap;text-align:center;min-height:34px}
.buy.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.buy:disabled,.buy[aria-disabled="true"]{opacity:.6}
.price{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:center;min-width:58px}
.days button b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.days button span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#f7f0de}
.days button[aria-pressed="true"] span{color:var(--gold-soft)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:9px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#f7f0de}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:7px 10px;font:inherit;font-size:13px}
.daylabel{font-family:var(--display);font-size:20px;font-weight:700;margin:2px 0 -2px;text-transform:uppercase;letter-spacing:.03em}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .t{font-weight:700;line-height:1.25}
.card .d{font-size:12.5px;color:var(--muted);flex:1}
.card .p{font-family:var(--display);font-size:19px}

.mapbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.leaflet-attribution-flag{display:none!important}
.venue{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.addr{font-size:12.5px;color:var(--muted)}

/* Pass */
.ticket{background:var(--navy);color:#f3ead6;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.ticket .tn{font-family:var(--display);font-size:24px;color:#fbf5e6;text-transform:uppercase;letter-spacing:.03em}
.qrstage{background:#fff;border-radius:14px;padding:10px;display:grid;place-items:center;min-width:260px;min-height:260px}
.qrstage canvas{display:block;width:240px;height:240px;image-rendering:pixelated}
.qrwait{color:#14213a;font-size:13.5px;max-width:220px}
.cd{display:flex;align-items:center;gap:8px;font-size:13px;color:#e8dfc8}
.cd svg{width:28px;height:28px;transform:rotate(-90deg)}
.cd .bg{stroke:rgba(255,255,255,.25)} .cd .fg{stroke:var(--gold);transition:stroke-dashoffset .9s linear}
.serial{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--gold-soft)}
.timer{font-size:12.5px;color:#e2dac6}
.zones{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.zones span{background:rgba(219,171,26,.16);color:#f3e3ad;border:1px solid rgba(219,171,26,.55);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.walletbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.walletbtns button{font-size:12.5px;border:1px solid rgba(233,220,188,.5);background:transparent;border-radius:8px;padding:7px 10px;color:#f3ead6}
.offline{font-size:12.5px;font-weight:700;color:#f3e3ad}
.kchip{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--gold-soft);color:#3d3010}

.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ph{margin:0;position:relative;border-radius:12px;overflow:hidden;background:var(--line);aspect-ratio:4/5;max-width:100%}
.ph.wide{grid-column:span 2;aspect-ratio:3/2}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;font-size:12px;color:#fbf5e6;background:linear-gradient(180deg,transparent,rgba(10,20,36,.85))}
.ph .st{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--gold);color:#16120a}
.upload{border:1.5px dashed var(--gold);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;background:var(--surface);position:relative}
.upload label{background:var(--btn);color:var(--btn-fg);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.upload input:focus-visible + label{outline:3px solid var(--gold);outline-offset:2px}

.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:#4a3a14}
.alert .ic svg{width:16px;height:16px}
.alert .w{font-size:11.5px;color:var(--muted)}
.pref{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:#8a93a6;position:relative;cursor:pointer;flex:0 0 auto;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--ok)} .sw:checked::after{left:21px}

.empty{border:1px dashed var(--line);border-radius:14px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted)}
.empty h2,.empty h3{color:var(--fg)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--navy-deep);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;color:#a9b8cc;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 2px;border-radius:8px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--gold);background:rgba(255,255,255,.07)}

.scrim{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:480px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet p{margin:0}
.sheetfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px}
.qty output{font-family:var(--mono);font-size:16px;min-width:20px;text-align:center}
.pay{background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;padding:12px;font-weight:700;width:100%;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fbf5e6;border:1px solid var(--gold);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;z-index:10;max-width:calc(100% - 32px)}
.field{display:flex;flex-direction:column;gap:4px}
#lmap{height:380px;width:100%;background:#dfe7ec}
.leaflet-container{font-family:var(--body)}
.mk{display:grid;place-items:center;border-radius:50%;font:700 12px/1 var(--body);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk-venue{width:28px;height:28px;background:#003057;border-color:#DBAB1A}
.mk-park{width:26px;height:26px;border-radius:6px;background:#2f7d4f}
.mk-lot-open{background:#2f7d4f}.mk-lot-filling{background:#8f530c}.mk-lot-full{background:#a33a2b}.mk-lot-closed{background:#4b5466}
.mk-stop{width:20px;height:20px;background:#DBAB1A;color:#00112E;font-size:10px}
.mk-ferry{width:24px;height:24px;background:#1f78a8;font-size:10px}
.mk-gate{width:30px;height:24px;border-radius:7px;background:#00112E;border-color:#DBAB1A;font-size:10px}
.mk-approx{border-style:dashed}
.leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.4}
.leaflet-popup-content b{font-size:14px}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.layers button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.layers button[aria-pressed="true"]{border-color:var(--gold-text)}
.layers button[aria-pressed="false"]{background:transparent;color:var(--muted);border-style:dashed}
.layers i{width:10px;height:10px;border-radius:50%;display:inline-block}
.loop{display:flex;flex-direction:column;gap:6px;padding:12px;border-top:1px solid var(--line)}
.loop:first-child{border-top:0}
.loop .stops{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.loop .stops span{background:var(--gold-soft);color:#3d3010;border-radius:6px;padding:2px 7px;font-weight:600;font-size:12px}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block;flex:0 0 auto}
.stoprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:13.5px;padding:4px 0;border-top:1px dashed var(--line)}
.stoprow:first-of-type{border-top:0}
.eta{font-family:var(--mono);font-weight:700;font-size:12.5px;white-space:nowrap}
.ls{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px;color:#fff;background:var(--closed)}
.ls.open{background:var(--ok)}.ls.filling{background:var(--warn)}.ls.full{background:var(--full)}.ls.closed{background:var(--closed)}
.shophead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cats button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.cats button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#f7f0de}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pc{border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;min-width:0}
.pc img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#fff;display:block;max-width:100%}
.pc .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.pc .t{font-size:13px;font-weight:600;line-height:1.3}
.pc .p{font-family:var(--display);font-size:16px}
.pimg{width:100%;max-width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#fff}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600;min-width:44px}
.sizes button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#f7f0de}
.sizes button:disabled{opacity:.45;text-decoration:line-through}
.bagline{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bagline img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#fff}
.acct{width:36px;height:36px;padding:0;justify-content:center;font-weight:800;font-size:12.5px}
.authbtn{width:100%;border-radius:12px;padding:12px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line)}
.authbtn.apple{background:#000;color:#fff;border-color:#000}
.authbtn.google{background:#fff;color:#1f1f1f;border-color:#747775}
.authbtn svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.inp{border:1px solid #8a93a6;background:var(--bg);color:var(--fg);border-radius:10px;padding:11px 12px;font:inherit;width:100%}

.shopall{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--gold);border-radius:12px;padding:12px;text-decoration:none;color:var(--fg);background:var(--surface)}

.mrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:14px 12px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.mrow:first-child{border-top:0}

.mrow .ic svg{width:19px;height:19px}
.mrow .t{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.mrow .chev{color:var(--muted);font-size:20px}
.faq{display:flex;flex-direction:column;gap:8px}
.faq h3{font-size:19px;margin-top:6px}
.faq p,.faq ul{margin:0}
.faq ul{padding-left:20px;display:flex;flex-direction:column;gap:3px}
.faq a{color:var(--gold-text);font-weight:700}
.tbc{color:var(--muted);font-style:italic}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:13px}
.lg{display:flex;align-items:center;gap:8px;min-width:0}
.lg .mk{flex:0 0 auto;font-size:11px}
.mk-svc{width:26px;height:26px;background:#003057;border-color:#DBAB1A}
.mk-util{width:26px;height:26px;background:#1f78a8}
.mk-aid{width:26px;height:26px;background:#a33a2b}
.mk-zone{width:26px;height:26px;background:#DBAB1A;color:#00112E;border-color:#00112E}
.qline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.qline:first-child{border-top:0}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:17px}
.sumline{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.rail{font-size:12.5px;color:var(--muted)}
.orders{display:flex;flex-direction:column;gap:10px}
.ocard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--gold);background:var(--surface);border-radius:14px;padding:12px 14px}
.ocard .t{font-weight:800}
.ocard .s{font-size:12.5px;color:var(--muted)}
.st{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--line);color:var(--fg);margin-left:6px;vertical-align:middle}
.st.ok{background:#2f7d4f;color:#fff}.st.pend{background:#8f530c;color:#fff}.st.bad{background:#a33a2b;color:#fff}.st.rx{background:#3a6fb0;color:#fff}
.rxscan video{width:100%;max-height:260px;border-radius:12px;background:#000;object-fit:cover}
details summary{cursor:pointer}

.acctno{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--gold);border-radius:14px;padding:12px 14px;background:var(--surface)}
.acctno output{font-family:var(--mono);font-size:22px;letter-spacing:.06em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0;user-select:all}
.car{border:1px solid var(--line);border-left:5px solid var(--gold);background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shot{position:relative;border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;min-width:0;background:var(--bg)}
.shot .ex{position:relative;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--ivory);color:var(--navy);display:grid;place-items:center}
.shot .ex img{width:100%;height:100%;object-fit:cover;display:block}
.shot .ex svg{width:88%;height:auto}
.shot .ex .st{position:absolute;top:6px;left:6px;margin:0}
.shot .t{font-weight:700;font-size:13px;line-height:1.25}
.shot .d{font-size:12px;color:var(--muted);flex:1}
.fileinp{position:absolute;width:1px;height:1px;opacity:0}
.fileinp:focus-visible + label{outline:3px solid var(--gold);outline-offset:2px}
.fileinp:disabled + label{opacity:.6;cursor:progress}
.shot label.buy{cursor:pointer}

.aqrow{display:flex;flex-direction:column;gap:6px}

.sheet ul.rail{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

  list.forEach(ev=>{
    if(!ev) return;
    const tts = (ev.ticket_types || ev.types || []).filter(Boolean).map(tt=>normType(tt, ev));
    types.push(...tts);
    events.push({id:String(ev.slug || ev.id), title:ev.title || "Event", starts_at:ev.starts_at, ends_at:ev.ends_at, venue:ev.venue || "",
      lat:ev.lat, lng:ev.lng, description:ev.description || "", image_url:ev.image_url || null, presenter:ev.presenter || null, kind:ev.kind || null, types:tts.map(t=>t.id)});
  });
  if(raw && Array.isArray(raw.ticket_types)) raw.ticket_types.forEach(tt=>{ if(!types.some(t=>t.id===String(tt.id))) types.push(normType(tt, null)); });
  return {at:Date.now(), events, types};
}
function typeState(t){
  const now = Date.now();
  if(t.sales_start && Date.parse(t.sales_start) > now) return ["soon", "On sale " + shortDate(t.sales_start)];
  if(t.sales_end && Date.parse(t.sales_end) < now) return ["closed", "Sales closed"];
  if(t.remaining!=null && t.remaining<=0) return ["full", "Sold out"];
  if(t.remaining!=null && t.remaining<=20) return ["few", t.remaining + " left"];
  return ["ok", "Available"];
}

  const cap = !types.length ? "ok" : st.some(x=>x==="ok") ? "ok" : st.some(x=>x==="few") ? "few" : st.some(x=>x==="soon") ? "soon" : st.every(x=>x==="closed") ? "closed" : "full";

}

// ---------- pass (tix.my_pass) + signed rotating QR (AudrainPass, credential function)
let passSeq = 0;
function normPass(r){
  if(!r) return {pass:null, tickets:[], zones:[]};
  const p = r.pass || ((r.id || r.pass_id || r.serial) ? r : null);
  const tickets = (r.tickets || r.entitlements || (p && p.tickets) || []).filter(Boolean).map(t=>({
    id:t.id, serial:t.serial || "", name:t.type_name || t.type || t.name || t.ticket_type || "Ticket", kind:t.kind || "ticket",
    event:t.event || t.event_title || "", event_slug:t.event_slug || null, starts_at:t.starts_at || t.valid_from || null,
    venue:t.venue || "", holder:(t.holder != null ? t.holder : t.holder_name) || "", zones:t.zones || [], status:t.status || "claimed",
    mine:t.mine !== false, waiting:t.waiting_for || t.reserved_email || null, used:t.used || [], order_id:t.order_id || null, is_comp:!!t.is_comp}));
  const zones = r.zones || (p && p.zones) || [...new Set(tickets.flatMap(t=>t.zones))];
  // account_no (Curtis call 2026-10-22) is the pass serial; the box office finds a pass by it, or by its last 4+ characters.
  return {pass: p ? {id:String(p.id || p.pass_id), serial:p.serial || "", account_no:p.account_no || r.account_no || p.serial || "", holder_name:p.holder_name || "", kind:p.kind || "attendee",
    rev:Number(p.cred_rev != null ? p.cred_rev : (p.rev || 0)), status:p.status || "active", year:p.year || null} : null, tickets, zones};
}
async function refreshPass(){
  if(!window.SB) return; await SB.ready; if(!SB.ok || !SB.user) return;
  const seq = ++passSeq; let r;
  try{ r = await SB.rpc("tix","my_pass",{p_app:APP}); }catch(e){ console.warn("[pass]", e.message); return; }
  if(seq!==passSeq) return;
  const n = normPass(r); n.at = Date.now(); n.uid = SB.user.id;
  state.passData = n; store.set("ae.pass", n);
  await ensureCredential();
  softRender("tickets");
}
async function postFn(name, body){
  if(window.SB) await SB.ready;
  if(window.AudrainCheckout && AudrainCheckout.callFunction){ await configureCheckout(); return AudrainCheckout.callFunction(name, body || {}); }
  let tok = null;
  try{ const s = await SB.client.auth.getSession(); tok = s && s.data && s.data.session && s.data.session.access_token; }catch(e){}
  const headers = {"Content-Type":"application/json", apikey:SBC.anon};
  if(tok) headers.Authorization = "Bearer " + tok;
  const r = await fetch(FUNCTIONS_URL + "/" + name, {method:"POST", headers, body:JSON.stringify(body || {})});
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!r.ok){ const err = new Error((j && (j.message || (typeof j.error==="string" ? j.error : null))) || ("Server error " + r.status)); err.code = j && j.error; err.status = r.status; throw err; }
  return j;
}
let credBusy = null;
const passSig = pd => passTicketsOf(pd).filter(t=>t.mine && t.status!=="void" && t.status!=="refunded").map(t=>String(t.id)).sort().join(",") + "|" + (pd.zones || []).slice().sort().join(",");
const passTicketsOf = pd => (pd && pd.tickets) || [];
function ensureCredential(force){
  if(credBusy) return credBusy;
  credBusy = (async ()=>{
    const pd = state.passData, P = pd && pd.pass;
    if(!P || !P.id || P.status==="void") return;
    if(!window.AudrainPass){ state.credErr = "pass_js"; return; }
    let key;
    try{ key = await AudrainPass.ensureDeviceKey(); }catch(e){ state.credErr = e.message; return; }
    const c = state.cred, cl = c && c.claims;
    // Claims carry short zone codes (g, h, v...), so compare what is on the pass rather than zone names.
    const contents = passSig(pd);
    const fresh = cl && c.pass_id===P.id && cl.s===P.serial && Number(cl.r)===P.rev && (!cl.dk || cl.dk===key.compressed) && c.contents===contents && (!cl.vt || cl.vt*1000 > Date.now());

// RPC call that keeps the PostgREST code and HTTP status, so "not deployed yet" can be told apart from a real refusal.
async function rpcX(schema, fn, args){

  const r = await SB.client.schema(schema).rpc(fn, args || {});
  if(r.error){ const m = r.error.message || "Something went wrong"; throw Object.assign(new Error(/Failed to fetch|NetworkError|Load failed/i.test(m) ? "No connection. Try again in a moment." : m), {code:r.error.code, status:r.status, details:r.error.details}); }

const isMissing = e => !!e && (["PGRST202","PGRST106","PGRST205","42883","3F000"].includes(e.code) || (e.status===404 && (!e.code || /^PGRST/.test(e.code))) || /could not find the function|schema must be one of/i.test(e.message || ""));
function badgeError(e){
  const m = String(e && e.message || "");
  if(e && e.offline) return m;
  if(/lock|too many/i.test(m)) return "Too many wrong codes. Adding badges is locked on this account for an hour. Try again later, or ask the Concours office.";
  if(/not found|code wrong|wrong code/i.test(m) && !isMissing(e)) return "We couldn't find that badge, or the code is wrong. Check both against the badge and try again.";
  if(/already|claimed|void|revoked/i.test(m)) return "This badge has already been added to a pass.";
  if(isMissing(e)) return "Adding badges isn't switched on yet. Nothing was changed.";
  return m || "That didn't work. Try again.";
}

let badgeBusy = false;
async function claimBadge(serial, code){
  const msg = document.getElementById("bdMsg"), say = s => { if(msg) msg.textContent = s; else toast(s); };
  serial = String(serial||"").trim().toUpperCase(); code = String(code||"").trim().toUpperCase();
  if(!/^[A-Z0-9]+(-[A-Z0-9]+)*$/.test(serial)) return say("Enter the badge number, for example AC27-1A2B3C4D5E.");
  if(!/^[A-Z0-9]{4,16}$/.test(code)) return say("Enter the claim code printed on the badge.");
  if(badgeBusy) return; badgeBusy = true;
  const btn = document.querySelector("[data-bdgo]"); if(btn) btn.disabled = true;
  say("Adding your badge…");
  try{
    const r = await rpcX("tix","claim_badge",{p_app:APP, p_serial:serial, p_code:code}) || {};
    // A refusal comes back as {ok:false, error} rather than an exception, so the failed try is kept for the lockout.
    if(r.ok === false) throw new Error(r.error || (r.locked ? "Too many tries" : "Badge not found or code wrong"));
    const n = Number(r.moved_count || 0), no = r.pass_serial || serial;
    const text = r.became_pass ? "This badge is now your pass. Everything on it is in the Tickets tab."
      : n ? `${n} ticket${n===1?"":"s"} moved from the badge onto your pass. The printed badge no longer scans; use the code in this app.`
      : "The badge is joined to your pass. It had no tickets on it yet.";
    openSheet("Badge added", `<p role="status">${esc(text)}</p>
      <div class="acctno"><output aria-label="Your account number">${esc(no)}</output></div><p class="price">Your account number. Give it to the Concours office to have tickets added.</p>
      <div class="sheetfoot"><button class="buy" type="button" data-close="1">Done</button></div>`);
    toast(r.became_pass ? "Badge added as your pass" : `Badge added: ${n} ticket${n===1?"":"s"} moved`);
    if(state.tab!=="tickets"){ state.tab = "tickets"; store.set("ae.tab","tickets"); dirty.tickets = true; }
    // refreshPass re-registers the device key when the serial or the tickets on the pass change, so the entry code re-signs.
    await refreshPass(); refreshOrders();
  }catch(e){ say(badgeError(e)); console.warn("[badge]", e.code || "", e.message); }
  finally{ badgeBusy = false; const b = document.querySelector("[data-bdgo]"); if(b) b.disabled = false; }
}

function cleanAuthError(m){
  m = String(m || "");
  if(/provider is not enabled|Unsupported provider|not enabled/i.test(m)) return "That sign-in option isn't switched on yet. Use your email instead.";
  if(/expired|invalid.*(otp|token)|token.*invalid|otp_expired/i.test(m)) return "That code is wrong or has expired. Ask for a new one.";
  if(/rate limit|too many|security purposes/i.test(m)) return "Too many tries. Wait a minute, then try again.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "No connection. Try again in a moment.";
  if(/signups not allowed/i.test(m)) return "We couldn't find an account for that email.";
  return m || "Something went wrong. Try again.";
}

const authSay = s => { const m = $("#authMsg"); if(m) m.textContent = s; };
async function sendCode(email){
  const e = String(email || ($("#authEmail") && $("#authEmail").value) || "").trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return authSay("Enter a valid email");
  if(!sbOn()) return authSay("No connection. Try again in a moment.");
  authSay("Sending your code…");
  try{
    if(SB.user && SB.user.is_anonymous){
      // A guest adds an email to the same account, so tickets already on this phone stay put.
      const r = await SB.client.auth.updateUser({email:e}, {emailRedirectTo:hereUrl()});
      // With email autoconfirm on (apply.py today) GoTrue applies the change at once and sends no code.
      if(!r.error && r.data && r.data.user && r.data.user.email===e && !r.data.user.new_email){ SB.user = r.data.user; closeSheet(); toast("Signed in as " + e); refreshPass(); return; }
      if(!r.error){ otp = {email:e, mode:"link"}; codeSheet(); return; }
      if(!/already|registered|exists|taken/i.test(r.error.message)) throw r.error;
    }
    const r2 = await SB.client.auth.signInWithOtp({email:e, options:{shouldCreateUser:true, emailRedirectTo:hereUrl()}});
    if(r2.error) throw r2.error;
    otp = {email:e, mode:"signin"}; codeSheet();
  }catch(err){ authSay(cleanAuthError(err.message)); }
}
async function moveGuestTickets(email){
  // Signing into an existing account from a guest phone: hand this phone's unused tickets to that email first,
  // so claim_my_tickets loads them into the account after sign-in.
  if(!(SB.user && SB.user.is_anonymous)) return 0;
  let n = 0;
  for(const t of passTickets().filter(x=>x.mine && x.status==="claimed" && !(x.used||[]).length)){
    try{ await SB.rpc("tix","send_ticket",{p_ticket_id:t.id, p_to_email:email}); n++; }catch(err){ console.warn("[move]", t.serial, err.message); }
  }
  return n;
}
async function verifyCode(){
  const c = String(($("#authCode") && $("#authCode").value) || "").replace(/\D/g,"");
  if(!otp) return signInSheet();
  if(!/^\d{6,10}$/.test(c)) return authSay("Enter the code from the email");
  if(!sbOn()) return authSay("No connection. Try again in a moment.");
  authSay("Checking…");
  try{
    if(otp.mode==="signin") await moveGuestTickets(otp.email);
    const r = await SB.client.auth.verifyOtp({email:otp.email, token:c, type: otp.mode==="link" ? "email_change" : "email"});
    if(r.error) throw r.error;
    if(otp.mode==="signin"){ try{ const x = await SB.rpc("tix","claim_my_tickets",{p_device:deviceId()}); if(x && x.loaded) toast(`${x.loaded} ticket${x.loaded===1?"":"s"} loaded onto your pass`); }catch(e){ console.warn("[claim]", e.message); } }
    const em = otp.email; otp = null; closeSheet(); toast("Signed in as " + em);
  }catch(err){ authSay(cleanAuthError(err.message) + (otp.mode==="signin" && passTickets().some(t=>t.mine) ? " Your tickets wait for this email; they load when you sign in with it." : "")); }
}
async function oauth(provider){
  const name = provider==="apple" ? "Apple" : "Google";
  if(!sbOn()) return authSay("No connection. Try again in a moment.");
  authSay(`Opening ${name}…`);
  try{
    // /auth/v1/settings is public: say so plainly when a provider isn't switched on, instead of sending people to an error page.
    const s = await fetch(SBC.url + "/auth/v1/settings", {headers:{apikey:SBC.anon}}).then(r=>r.ok ? r.json() : null).catch(()=>null);
    if(s && s.external && s.external[provider]!==true) return authSay(`Sign in with ${name} isn't switched on yet. Use your email instead.`);
    const opts = {provider, options:{redirectTo:hereUrl(), skipBrowserRedirect:true}};
    const keep = SB.user && SB.user.is_anonymous && passTickets().some(t=>t.mine);
    let r;
    if(keep){
      r = SB.client.auth.linkIdentity ? await SB.client.auth.linkIdentity(opts) : {error:new Error("link")};
      if(r.error) return authSay(`To keep the tickets on this phone, sign in with your email instead of ${name}.`);
    } else r = await SB.client.auth.signInWithOAuth(opts);
    if(r.error) throw r.error;
    if(r.data && r.data.url) location.assign(r.data.url);
  }catch(e){ authSay(cleanAuthError(e.message)); }
}
function authFromUrl(){
  // Magic links and OAuth come back here (sb.js leaves detectSessionInUrl off, so the page finishes the sign-in).
  const h = new URLSearchParams((location.hash || "").replace(/^#/, "")), q = new URLSearchParams(location.search);
  const clear = () => history.replaceState(null, "", location.pathname);
  const err = h.get("error_description") || q.get("error_description");
  if(err){ clear(); setTimeout(()=>toast(cleanAuthError(err)), 300); return; }
  const at = h.get("access_token"), rt = h.get("refresh_token"), code = q.get("code");
  if(!(at && rt) && !code) return;
  clear();
  SB.ready.then(()=>{ if(!SB.ok) return null; return at ? SB.client.auth.setSession({access_token:at, refresh_token:rt}) : SB.client.auth.exchangeCodeForSession(code); })
    .then(r=>{ if(r && r.error) toast(cleanAuthError(r.error.message)); else if(r) toast("Signed in"); })
    .catch(e=>toast(cleanAuthError(e.message)));
}

let pushWired = false;
const nativeApp = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
async function enablePush(){
  if(!nativeApp()){ toast("Phone notifications come with the App Store and Google Play app."); return; }
  const PN = window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
  if(!PN){ toast("Notifications aren't available in this version of the app."); return; }
  try{
    let p = await PN.checkPermissions();
    if(p.receive==="prompt" || p.receive==="prompt-with-rationale") p = await PN.requestPermissions();
    if(p.receive!=="granted"){ toast("Notifications are off. You can turn them on in your phone's settings."); return; }
    if(!pushWired){
      pushWired = true;
      PN.addListener("registration", t=>{ state.pushToken = t.value; store.set("ae.push", t.value); registerPush(); toast("Notifications on"); });
      PN.addListener("registrationError", e=>{ console.warn("[push]", e && e.error); toast("Notifications couldn't be set up. Try again later."); });
    }
    await PN.register();
  }catch(e){ console.warn("[push]", e.message); toast("Notifications couldn't be set up. Try again later."); }
}

// ---------- live operations: ops.live (lots, trolley routes + stops + vehicles + ETAs, gates)
function etasFor(stop, raw){
  let v = stop.etas != null ? stop.etas : stop.eta_min != null ? stop.eta_min : stop.next != null ? stop.next : stop.eta;
  if(v==null && raw && raw.etas){ v = Array.isArray(raw.etas) ? raw.etas.filter(x=>x && String(x.stop_id)===String(stop.id)) : raw.etas[stop.id]; }
  if(v==null) return [];
  if(!Array.isArray(v)) v = [v];
  return v.map(x=>{
    if(typeof x==="number") return x;
    if(typeof x==="string") return isNaN(Number(x)) ? (Date.parse(x) - Date.now())/60000 : Number(x);
    if(x && typeof x==="object"){ const m = x.eta_min != null ? x.eta_min : x.minutes != null ? x.minutes : x.min; if(m != null) return Number(m); const at = x.at || x.eta_at || x.eta; if(at) return (Date.parse(at) - Date.now())/60000; }
    return null;
  }).filter(n=>n!=null && isFinite(n) && n>-1).map(n=>Math.max(0, Math.round(n))).sort((a,b)=>a-b);
}
function normLive(r){
  r = r || {};
  const ll = o => (o && o.lat!=null && o.lng!=null) ? [Number(o.lat), Number(o.lng)] : null;
  const lots = (r.lots || []).map(l=>({id:String(l.id), name:l.name || "Lot", ll:ll(l), capacity:l.capacity!=null ? Number(l.capacity) : null, status:LOT_STATUS[l.status] ? l.status : "open", note:l.note || "", updated_at:l.updated_at || null, addr:l.address || l.addr || ""}));
  const allStops = r.stops || [];
  const routes = (r.routes || []).map(rt=>{
    const stops = (rt.stops || allStops.filter(s=>String(s.route_id)===String(rt.id))).slice().sort((a,b)=>(a.seq||0)-(b.seq||0))
      .map(s=>({id:String(s.id), name:s.name || "Stop", ll:ll(s), seq:s.seq || 0, etas:etasFor(s, r)}));
    const path = Array.isArray(rt.path) ? rt.path.filter(p=>Array.isArray(p) && p.length>=2).map(p=>[Number(p[0]), Number(p[1])]) : [];
    return {id:String(rt.id), name:rt.name || "Trolley", color:/^#[0-9a-f]{3,8}$/i.test(rt.color||"") ? rt.color : "#8a5a9e", path, headway:rt.headway_min!=null ? Number(rt.headway_min) : null, runs:rt.runs || "", stops};
  });
  const vehicles = (r.vehicles || r.positions || []).map(v=>({id:String(v.vehicle_id || v.id), name:v.name || "Trolley", route_id:v.route_id!=null ? String(v.route_id) : null, ll:ll(v), at:v.at || null, heading:v.heading})).filter(v=>v.ll);
  const gates = (r.gates || []).map(g=>({id:String(g.id || g.code || g.name), name:g.name || g.code || "Gate", kind:["entry","exit","both"].includes(g.kind) ? g.kind : "entry", zone:g.zone || "general", ll:ll(g), status:g.status || null, note:g.note || ""}));
  return {at:Date.now(), lots, routes, vehicles, gates};
}

let lmap = null, mapLayers = {};
function mkIcon(cls, txt, approx){ return L.divIcon({className:"", html:`<div class="mk ${cls}${approx?" mk-approx":""}">${txt||""}</div>`, iconSize:null}); }
function gmaps(q){ return "https://maps.google.com/?q=" + encodeURIComponent(q); }
const ITEM_TYPES = {boxoffice:["Box office / Will Call","mk-svc","1","grounds"], infobooth:["Info booth","mk-svc","2","grounds"], food:["Food & bar","mk-svc","3","grounds"], merch:["Merch","mk-svc","4","grounds"], ada:["ADA viewing","mk-svc","5","grounds"], restroom:["Restrooms","mk-svc","6","grounds"], water:["Water","mk-util","7","grounds"], charging:["Charging","mk-util","8","grounds"], firstaid:["First aid","mk-aid","+","grounds"], zone:["Show field zone","mk-zone","A","grounds"], stage:["Awards stage","mk-zone","S","grounds"], vip:["VIP pavilion","mk-zone","V","grounds"], sponsor:["Sponsor display","mk-zone","D","grounds"], stop:["Trolley stop","mk-stop","T","trolley"], parking:["Parking","mk-park","P","parking"], landing:["Ferry or shuttle landing","mk-ferry","F","ferry"], closure:["Road closure","mk-closure","×","extra"], info:["Info point","mk-info","i","extra"], post:["Staff post","mk-post","S","extra"]};

function editorPopup(key){ return state.edit ? `<div style="margin-top:6px;display:flex;gap:6px"><button type="button" data-editem="${key}">Edit</button><button type="button" data-rmitem="${key}">Remove</button></div>` : ""; }

  if(state.edit) m.on("dragend", ev=>{ const p = ev.target.getLatLng(); const nl = [+p.lat.toFixed(6), +p.lng.toFixed(6)];

function buildTransport(){

  if(liveLots().length) liveLots().forEach(l=>{ const m = liveMarker(l.ll, mkIcon("mk-park mk-lot-" + l.status, "P"), `${l.name}: ${LOT_STATUS[l.status]}`, `<b>Parking: ${esc(l.name)}</b><br><span class="ls ${l.status}">${LOT_STATUS[l.status]}</span>${l.capacity ? `<br>${l.capacity.toLocaleString("en-US")} spaces` : ""}${l.note ? `<br>${esc(l.note)}` : ""}<br><a href="${gmaps(l.addr || l.ll.join(","))}" target="_blank" rel="noopener">Directions</a>`, G.parking); if(m) pts.push(m.getLatLng()); });

// Phone photos are often 4000px+ and HEIC-sized: re-encode to a JPEG of at most 2000px on the long side before upload.
async function downscale(file, max){
  let src = null, w = 0, h = 0, done = ()=>{};
  if(window.createImageBitmap){ try{ src = await createImageBitmap(file, {imageOrientation:"from-image"}); w = src.width; h = src.height; done = ()=>{ if(src.close) src.close(); }; }catch(e){ src = null; } }
  if(!src){
    const url = URL.createObjectURL(file);
    try{ src = await new Promise((res, rej)=>{ const im = new Image(); im.onload = ()=>res(im); im.onerror = ()=>rej(new Error("decode")); im.src = url; }); }
    catch(e){ URL.revokeObjectURL(url); throw e; }
    w = src.naturalWidth; h = src.naturalHeight; done = ()=>URL.revokeObjectURL(url);
  }
  const k = Math.min(1, max / Math.max(w, h, 1)), cw = Math.max(1, Math.round(w*k)), ch = Math.max(1, Math.round(h*k));
  const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
  const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cw, ch); cx.drawImage(src, 0, 0, cw, ch); done();
  return new Promise((res, rej)=>cv.toBlob(b=>b ? res(b) : rej(new Error("encode")), "image/jpeg", 0.85));
}
async function uploadShot(input){
  const f = input.files && input.files[0], vid = input.dataset.veh, shot = input.dataset.shot, id = input.id;
  const say = s => { const m = document.getElementById(id + "-msg"); if(m) m.textContent = s; };
  if(!f) return;
  if(!entGate()){ input.value = ""; return; }
  if(f.type && !/^image\//.test(f.type)){ say("Choose a photo."); input.value = ""; return; }
  input.disabled = true; say("Preparing the photo…");
  let blob;
  try{ blob = await downscale(f, PHOTO_MAX); }
  catch(e){ say("This photo can't be read here. Try a JPEG, or take the photo again."); input.disabled = false; input.value = ""; return; }
  const path = `${SB.user.id}/${vid}/${shot}-${Math.floor(Date.now()/1000)}.jpg`;
  say("Uploading…");
  try{
    const up = await SB.client.storage.from(PHOTO_BUCKET).upload(path, blob, {contentType:"image/jpeg", upsert:false, cacheControl:"3600"});
    if(up.error) throw Object.assign(new Error(up.error.message || "Upload failed"), {storage:true});
    await rpcX("entrants","add_photo",{p_vehicle_id:vid, p_shot:shot, p_path:path});
    thumbs[path] = {url:URL.createObjectURL(blob), exp:Infinity};
    toast("Photo added");
    await loadEntrant();
    const again = document.getElementById(id); if(again) again.focus({preventScroll:true});
  }catch(e){
    say(e.storage ? (/bucket.*not found|not found/i.test(e.message) ? "Photo uploads aren't switched on yet. Nothing was uploaded." : "The upload didn't go through: " + e.message)
      : isMissing(e) ? "Car applications aren't switched on yet." : e.message);
    console.warn("[photo]", e.message);
  }finally{ const i = document.getElementById(id); if(i){ i.disabled = false; i.value = ""; } }
}
// Thumbnails come from signed URLs (the bucket is private); one batch call per render, cached for 55 minutes.
async function paintThumbs(){
  const imgs = [...document.querySelectorAll("img[data-thumb]")]; if(!imgs.length) return;
  const now = Date.now(), need = [...new Set(imgs.map(i=>i.dataset.thumb).filter(p=>!(thumbs[p] && thumbs[p].exp>now)))];
  if(need.length && sbOn()){
    try{ const r = await SB.client.storage.from(PHOTO_BUCKET).createSignedUrls(need, 3600); (r.data || []).forEach(x=>{ if(x && x.signedUrl && !x.error) thumbs[x.path] = {url:x.signedUrl, exp:now + 55*60000}; }); }
    catch(e){ console.warn("[thumbs]", e.message); }
  }
  document.querySelectorAll("img[data-thumb]").forEach(i=>{ const t = thumbs[i.dataset.thumb]; if(t && i.getAttribute("src")!==t.url) i.src = t.url; });
}

  if(el.id==="getOffSel"){ state.getOff = el.value; const box = document.getElementById("transport"); if(box){ box.innerHTML = transportLists(); const s = document.getElementById("getOffSel"); if(s) s.focus(); } return; }
  if(el.dataset && el.dataset.pref){ state.prefs[el.dataset.pref] = el.checked; store.set("ae.prefs", state.prefs); registerPush(); }
});
document.addEventListener("keydown", ev=>{
  const open = !$("#scrim").hidden;
  if(ev.key==="Escape" && open){ closeSheet(); return; }
  if(ev.key==="Tab" && open){ // keep focus inside the sheet while it is open
    const f = [...$("#scrim").querySelectorAll(FOCUSABLE)].filter(x=>x.offsetParent!==null); if(!f.length) return;
    const first = f[0], last = f[f.length-1];
    if(ev.shiftKey && document.activeElement===first){ ev.preventDefault(); last.focus(); }
    else if(!ev.shiftKey && document.activeElement===last){ ev.preventDefault(); first.focus(); }
  }
});
$("#scrim").addEventListener("click", ev=>{ if(ev.target.id==="scrim") closeSheet(); });
addEventListener("online", ()=>{ refreshPass(); refreshLiveOps(); });
addEventListener("offline", ()=>{ const o = document.getElementById("qrOffline"); if(o) o.textContent = "You're offline. This code still works."; });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ if(state.tab==="tickets") refreshPass(); if(state.tab==="map") refreshLiveOps(); } });

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt = e; });
function install(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; return; }
  openSheet("Install on your phone", `<p><b>iPhone</b></p><ol><li>Open the app link in Safari.</li><li>Tap the Share button.</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>
  <p><b>Android</b></p><ol><li>Open the app link in Chrome.</li><li>Tap the menu (three dots).</li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>
  <p class="notice">The app then opens full-screen from its own icon, like any other app.</p>
  <div class="sheetfoot"><button class="buy" type="button" data-close="1">Done</button></div>`);
}

// ---------- start
if(!views[state.tab]) state.tab = "itinerary";
paintLogo(); paintAcct(); render();
track("page_view", {props:{screen:state.tab}});
startLive();
if(window.SB){
  SB.ready.then(()=>{ if(SB.ok && window.AudrainTrack && AudrainTrack.configure) try{ AudrainTrack.configure({supabase:SB.client, app:APP}); }catch(e){} });
  authFromUrl();
  SB.onAuth(u=>{ onAuthChange(u); });
  refreshCatalog(); refreshLiveOps();
  // A #claim- link loads its ticket onto this phone's pass; a #badge-<serial>:<code> link claims a printed badge the same way.
  const claimFromHash = () => SB.ready.then(()=>{
    let h = location.hash || ""; try{ h = decodeURIComponent(h); }catch(e){}
    const m = CLAIM_RE.exec(h); if(m && SB.ok){ history.replaceState(null, "", location.pathname + location.search); claimLive(m[1], m[2]); return; }
    const b = /^#badge-/i.test(h) && BADGE_RE.exec(h); if(b && SB.ok){ history.replaceState(null, "", location.pathname + location.search); badgeSheet({serial:b[1], code:b[2]}); claimBadge(b[1], b[2]); }
  });
  claimFromHash(); addEventListener("hashchange", claimFromHash);
}
})();
</script>
