<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#003057">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Audrain">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Audrain Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first app shell - sticky header with event switcher and alerts bell, one scrolling view, fixed five-tab bar. Centered 480px column on wider screens. */
:root{
  --navy:#003057; --navy-deep:#00112E; --gold:#DBAB1A; --gold-text:#8A6A0A; --gold-soft:#f3e3ad;
  --ivory:#f7f3ea; --card:#fffdf8; --ink:#14213a; --muted:#5d6678; --line:#e3dccb;
  --ok:#2f7d4f; --warn:#b26a12; --full:#a33a2b;
  --bg:var(--ivory); --fg:var(--ink); --surface:var(--card); --bar:var(--navy); --bar-fg:#f3ead6; --btn:var(--navy); --btn-fg:#f7f0de;
  --display:"Agdasima", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#001229; --fg:#ece8dc; --surface:#082440; --line:#1c3d63; --gold-text:#DBAB1A; --muted:#9aa6bd;
  --bar:#00112E; --bar-fg:#efe4c8; --gold-soft:#e9dcbc; --btn:var(--gold); --btn-fg:#16120a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#001229; --fg:#ece8dc; --surface:#082440; --line:#1c3d63; --gold-text:#DBAB1A; --muted:#9aa6bd;
  --bar:#00112E; --bar-fg:#efe4c8; --gold-soft:#e9dcbc; --btn:var(--gold); --btn-fg:#16120a; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg);padding:12px 16px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.04em;text-transform:uppercase;min-width:0;line-height:1.05}
.mark small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.tools{display:flex;gap:8px;flex:0 0 auto}
.iconbtn{position:relative;border:1px solid rgba(233,220,188,.4);background:transparent;color:var(--bar-fg);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.iconbtn svg{width:18px;height:18px}
.badge{position:absolute;top:-4px;right:-4px;background:var(--gold);color:#16120a;border-radius:999px;font-size:10px;font-weight:800;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.switch{display:flex;gap:6px;margin-top:12px}
.switch button{flex:1;border:1px solid rgba(233,220,188,.3);background:transparent;color:var(--bar-fg);border-radius:10px;padding:8px 6px;font-size:13px;font-weight:600}
.switch button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#16120a}

main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:20px}
.notice{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;color:var(--fg);text-transform:uppercase;letter-spacing:.03em}
h1{font-size:36px;line-height:1}
h2{font-size:24px;line-height:1.05}
h3{font-size:17px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text)}
.hero .eyebrow,.banner .eyebrow,.ticket .eyebrow{color:var(--gold)}
.hero{position:relative;border-radius:16px;overflow:hidden;color:#f7f0de;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;background:var(--navy) url("photos/field.jpg") center 30%/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,48,87,.05) 20%,rgba(0,48,87,.92) 85%)}
.hero > *{position:relative}
.hero h1{color:#fbf5e6}
.hero p{margin:6px 0 0;color:#e2dac6;font-size:14px}
.stats{display:flex;gap:18px;font-size:12px;color:#e2dac6;margin-top:10px}
.stats b{display:block;font-family:var(--display);font-size:20px;color:#fbf5e6}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.link{background:none;border:0;padding:0;color:var(--gold-text);font-weight:700;font-size:13px}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.time{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;padding-top:2px}
.time span{display:block;font-size:11px;color:var(--muted)}
.info{min-width:0;display:flex;flex-direction:column;gap:4px}
.title{font-weight:600;line-height:1.3}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.chip{font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:999px;padding:2px 8px;border:1px solid var(--line);display:inline-block}
.chip.lange{border-color:var(--gold);color:var(--gold-text)}
.chip.booked{background:var(--ok);border-color:var(--ok);color:#fff}
.dot{display:inline-flex;align-items:center;gap:5px}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.few::before{background:var(--warn)} .dot.full::before{background:var(--full)}
.actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mini{display:flex;gap:2px}
.save{background:none;border:0;padding:3px;line-height:1;color:var(--muted);display:grid;place-items:center}
.save svg{width:20px;height:20px}
.save[aria-pressed="true"]{color:var(--gold-text)}
.buy{display:inline-block;text-decoration:none;background:var(--btn);color:var(--btn-fg);border:0;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap;text-align:center}
.buy.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.price{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:center;min-width:58px}
.days button b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.days button span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#f7f0de}
.days button[aria-pressed="true"] span{color:var(--gold-soft)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#f7f0de}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:7px 10px;font-size:13px;font:inherit;font-size:13px}
.daylabel{font-family:var(--display);font-size:20px;font-weight:700;margin:2px 0 -2px;text-transform:uppercase;letter-spacing:.03em}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .t{font-weight:700;line-height:1.25}
.card .d{font-size:12.5px;color:var(--muted);flex:1}
.card .p{font-family:var(--display);font-size:19px}

.mapbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.mapbox > svg{display:block;width:100%;height:auto}
.leaflet-attribution-flag{display:none!important}
.venue{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.addr{font-size:12.5px;color:var(--muted)}

.wallet{display:flex;flex-direction:column;gap:10px}
.tk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--surface);border-radius:12px;padding:12px;text-align:left;width:100%}
.tk .t{font-weight:700}
.tk .s{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tk[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.ticket{background:var(--navy);color:#f3ead6;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.ticket .tn{font-family:var(--display);font-size:22px;color:#fbf5e6}
.ticket .eyebrow{color:var(--gold)}
.qrwrap{background:#fff;border-radius:12px;padding:10px;position:relative}
.qrwrap canvas{display:block;width:196px;height:196px;image-rendering:pixelated}
.sample{position:absolute;left:0;right:0;top:44%;transform:rotate(-14deg);font-weight:800;letter-spacing:.2em;color:rgba(163,58,43,.85);font-size:20px;pointer-events:none}
.serial{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--gold-soft)}
.timer{font-size:12px;color:#d6cdb6}
.walletbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.walletbtns span{font-size:12px;border:1px solid rgba(233,220,188,.4);border-radius:8px;padding:6px 10px;color:#f3ead6}

.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ph{margin:0;position:relative;border-radius:12px;overflow:hidden;background:var(--line);aspect-ratio:4/5;max-width:100%}
.ph.wide{grid-column:span 2;aspect-ratio:3/2}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;font-size:12px;color:#fbf5e6;background:linear-gradient(180deg,transparent,rgba(10,20,36,.85))}
.ph .st{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--gold);color:#16120a}
.upload{border:1.5px dashed var(--gold);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;background:var(--surface)}
.upload label{background:var(--btn);color:var(--btn-fg);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.upload input:focus-visible + label{outline:2px solid var(--gold);outline-offset:2px}

.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:#4a3a14}
.alert .ic svg{width:16px;height:16px}
.alert .w{font-size:11.5px;color:var(--muted)}
.pref{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sw{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--ok)} .sw:checked::after{left:21px}

.empty{border:1px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted)}
.empty h2{color:var(--fg)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--navy-deep);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;color:#9fb0c6;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 2px;border-radius:8px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--gold);background:rgba(255,255,255,.07)}

.scrim{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:480px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet p{margin:0}
.sheetfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px}
.qty output{font-family:var(--mono);font-size:16px;min-width:20px;text-align:center}
.pay{background:#000;color:#fff;border:0;border-radius:10px;padding:11px;font-weight:700;width:100%}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fbf5e6;border:1px solid var(--gold);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;z-index:10;max-width:calc(100% - 32px)}
.badgecard{align-self:center;width:230px;max-width:100%;background:#fffdf8;color:#14213a;border-radius:14px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(10,20,40,.18);overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center}
.badgecard .slot{width:46px;height:8px;border-radius:6px;background:#d8d1c0;margin:10px 0 6px}
.badgecard .band{width:100%;background:#003057;color:#e9dcbc;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:6px}
.badgecard .nm{font-family:var(--display);font-size:22px;font-weight:700;margin:12px 10px 2px;color:#14213a}
.badgecard .tier{font-size:12px;font-weight:700;color:#8A6A0A;letter-spacing:.08em;text-transform:uppercase}
.badgecard canvas{width:120px;height:120px;image-rendering:pixelated;margin:10px 0 4px}
.badgecard .sn{font-family:var(--mono);font-size:11.5px;color:#14213a;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field input{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 10px;font:inherit}
#lmap{height:380px;width:100%;background:#dfe7ec}
.leaflet-container{font-family:var(--body)}
.mk{display:grid;place-items:center;border-radius:50%;font:700 12px/1 var(--body);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk-venue{width:28px;height:28px;background:#003057;border-color:#DBAB1A}
.mk-park{width:26px;height:26px;border-radius:6px;background:#2f7d4f}
.mk-stop{width:18px;height:18px;background:#DBAB1A;font-size:9px}
.mk-ferry{width:24px;height:24px;background:#1f78a8;font-size:10px}
.mk-approx{border-style:dashed}
.leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.4}
.leaflet-popup-content b{font-size:14px}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.layers button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.layers button[aria-pressed="false"]{opacity:.5}
.layers i{width:10px;height:10px;border-radius:50%;display:inline-block}
.loop{display:flex;flex-direction:column;gap:4px;padding:12px;border-top:1px solid var(--line)}
.loop:first-child{border-top:0}
.loop .stops{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.loop .stops span{background:var(--gold-soft);color:#3d3010;border-radius:6px;padding:2px 7px;font-weight:600;font-size:12px}
.shophead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cats button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.cats button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#f7f0de}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pc{border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;min-width:0}
.pc img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#fff;display:block;max-width:100%}
.pc .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.pc .t{font-size:13px;font-weight:600;line-height:1.3}
.pc .p{font-family:var(--display);font-size:16px}
.pimg{width:100%;max-width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#fff}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600;min-width:44px}
.sizes button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#f7f0de}
.sizes button:disabled{opacity:.35;text-decoration:line-through}
.bagline{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bagline img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#fff}
.acct{width:34px;height:34px;padding:0;justify-content:center;font-weight:800;font-size:12.5px}
.authbtn{width:100%;border-radius:12px;padding:12px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line)}
.authbtn.apple{background:#000;color:#fff;border-color:#000}
.authbtn.google{background:#fff;color:#1f1f1f;border-color:#dadce0}
.authbtn svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.inp{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:11px 12px;font:inherit;width:100%}
.codebox{letter-spacing:.5em;text-align:center;font-family:var(--mono);font-size:20px}
.rolechip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--gold);color:#16120a}
.edbar{display:flex;flex-direction:column;gap:8px;border:2px solid var(--gold);border-radius:14px;padding:10px;background:var(--surface)}
.edbar .row1{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.edbar select{flex:1;min-width:140px}
.mk-closure{width:24px;height:24px;background:#a33a2b}
.mk-info{width:24px;height:24px;background:#3a6fb0}
.mk-post{width:24px;height:24px;background:#7a4fa0}
.leaflet-marker-draggable .mk{box-shadow:0 0 0 3px rgba(219,171,26,.65),0 2px 6px rgba(0,0,0,.4)}
.daychk{display:flex;gap:6px;flex-wrap:wrap}
.daychk label{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;display:flex;gap:5px;align-items:center}
.merch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mi{border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--fg);min-width:0}
.mi img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#fff;display:block;max-width:100%}
.mi .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.mi .t{font-size:13px;font-weight:600;line-height:1.3}
.mi .p{font-family:var(--display);font-size:16px}
.mi .o{font-size:12px;font-weight:700;color:var(--gold-text)}
.shopall{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--gold);border-radius:12px;padding:12px;text-decoration:none;color:var(--fg);background:var(--surface)}
.banner{position:relative;border-radius:14px;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;background:#003057 center 35%/cover}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,48,87,.30) 0%,rgba(0,17,46,.92) 88%)}
.banner > *{position:relative}
.banner h1{color:#fff;font-size:44px}
.banner p{color:#dfe7f0;margin:4px 0 0;font-size:14px}
.mrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:14px 12px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.mrow:first-child{border-top:0}
.mrow .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--navy);color:var(--gold)}
.mrow .ic svg{width:19px;height:19px}
.mrow .t{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.mrow .chev{color:var(--muted);font-size:20px}
.faq{display:flex;flex-direction:column;gap:8px}
.faq h3{font-size:19px;margin-top:6px}
.faq p,.faq ul{margin:0}
.faq ul{padding-left:20px;display:flex;flex-direction:column;gap:3px}
.faq a{color:var(--gold-text);font-weight:700}
.tbc{color:var(--muted);font-style:italic}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:13px}
.lg{display:flex;align-items:center;gap:8px;min-width:0}
.lg .mk{flex:0 0 auto;font-size:11px}
.mk-svc{width:26px;height:26px;background:#003057;border-color:#DBAB1A}
.mk-util{width:26px;height:26px;background:#1f78a8}
.mk-aid{width:26px;height:26px;background:#a33a2b}
.mk-zone{width:26px;height:26px;background:#DBAB1A;color:#00112E;border-color:#00112E}
.pmrow{display:flex;gap:8px;flex-wrap:wrap}
.pm{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13.5px;min-width:72px;text-align:center;color:var(--fg)}
.pm.apple{background:#000;color:#fff;border-color:#000}
.pm.gpay{background:#fff;color:#1f1f1f;border-color:#dadce0}
.pm.paypal{background:#ffc439;color:#003087;border-color:#ffc439}
.pm.venmo{background:#008cff;color:#fff;border-color:#008cff}
.pm[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:2px}
.qline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.qline:first-child{border-top:0}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:17px}
.rail{font-size:12.5px;color:var(--muted)}
.orders{display:flex;flex-direction:column;gap:10px}
.ocard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--gold);background:var(--surface);border-radius:14px;padding:12px 14px}
.ocard[aria-expanded="true"]{box-shadow:0 0 0 2px var(--gold)}
.ocard .t{font-weight:800}
.ocard .s{font-size:12.5px;color:var(--muted)}
.st{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--line);color:var(--fg);margin-left:6px;vertical-align:middle}
.st.ok{background:#2f7d4f;color:#fff}.st.pend{background:#b26a12;color:#fff}.st.demo{background:var(--line);color:var(--fg)}.st.rx{background:#3a6fb0;color:#fff}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.carousel::-webkit-scrollbar{display:none}
.carousel .ticket{flex:0 0 100%;scroll-snap-align:center;min-width:0}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--gold)}
.tstate{font-size:12.5px;font-weight:700;color:#d6cdb6}
.tbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tbtns .buy{background:var(--gold);color:#16120a}
.tbtns .buy.ghost{background:transparent;color:#f3ead6;border:1px solid rgba(233,220,188,.45)}
.bigcheck{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--gold);color:#16120a;font-weight:800;font-size:16px}
.xferd{padding:30px 10px;color:#d6cdb6;font-weight:700}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1/1;max-width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:18%;border:3px solid var(--gold);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.admitted{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;background:#1f7a46}
.admitted.re{background:#1d6a8f}.admitted.bad{background:#a33a2b}
.admitted h1{color:#fff;font-size:44px;letter-spacing:.04em}
.admitted .alist{width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px;text-align:left;background:rgba(0,0,0,.18);border-radius:14px;padding:12px}
.admitted .alist div{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.admitted .alist span{font-family:var(--mono);font-size:12px;opacity:.9}
.admitted button{border:0;border-radius:12px;padding:12px 22px;font-weight:800;background:#fff;color:#1a1a1a}
.chk{width:110px;height:110px}
.chk circle{fill:none;stroke:rgba(255,255,255,.35);stroke-width:6}
.chk path{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .55s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.admclock{font-family:var(--mono);font-size:22px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;scroll-behavior:auto!important} }

function row(e, showDay){
  const tm = fmtTime(e.t), dp = dayParts(e.d), c = CAP[e.cap||"ok"], v = VENUES[e.v], b = booked(e.id), on = state.saved.has(e.id) || b;
  let btn;
  if(b) btn = `<button class="buy ghost" type="button" data-showticket="${e.id}">View ticket</button>`;
  else if(e.kind==="free") btn = e.link ? `<a class="buy ghost" href="${e.link}" target="_blank" rel="noopener">Details</a>` : `<span class="chip">Free</span>`;
  else if(e.kind==="members") btn = `<span class="chip">Members</span>`;
  else if(e.kind==="invite") btn = `<a class="buy ghost" href="${e.link}" target="_blank" rel="noopener">Details</a>`;
  else if(e.kind==="info") btn = `<span class="chip">Info</span>`;
  else if(e.cap==="full") btn = `<button class="buy ghost" type="button" data-wait="${e.id}">Waitlist</button>`;
  else btn = `<button class="buy" type="button" data-buy="${e.id}">Buy</button>`;
  return `<div class="row">
    <div class="time">${tm.hm}<span>${showDay ? dp.wd : tm.ap}</span></div>
    <div class="info">
      <div class="title">${esc(e.title)}</div>
      ${e.presenter ? `<div><span class="chip lange">${/^hosted/.test(e.presenter) ? "Hosted" + esc(e.presenter.slice(6)) : "Presented by " + esc(e.presenter)}</span></div>` : ""}
      <div class="meta">${b ? `<span class="chip booked">Booked</span>` : ""}<span>${esc(e.note || v.short)}</span>${e.e ? `<span>${endLabel(e)}</span>` : ""}${e.kind==="ticketed" ? `<span class="dot ${c[0]}">${c[1]}</span>` : ""}</div>
    </div>
    <div class="actions">
      <button class="save" type="button" data-save="${e.id}" aria-pressed="${on}" aria-label="${on?"Remove from":"Add to"} my itinerary">${HEART(on)}</button>
      ${btn}
      <span class="price">${priceLabel(e)}</span>
    </div>
  </div>`;
}

let qrTimer = null;
function drawQR(){
  const cs = document.querySelectorAll("canvas.qrc"); if(!cs.length) return stopQR(); cs.forEach(drawQRCanvas);
  const lft = 15 - Math.floor((Date.now()%15000)/1000); document.querySelectorAll(".qrtimer").forEach(t=>t.textContent = `Code refreshes in ${lft}s. Screenshots will not scan.`); return;
  const c = null;
  const w = state.wallet[Math.min(state.open, state.wallet.length-1)];
  const x = c.getContext("2d"), N = 29, slot = Math.floor(Date.now()/15000);
  let s = (slot * 2654435761 + [...w.serial].reduce((a,ch)=>a*31+ch.charCodeAt(0)>>>0,7)) >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  x.fillStyle = "#fff"; x.fillRect(0,0,N,N); x.fillStyle = "#003057";
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){ const inF = (i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9); if(!inF && rnd()>.52) x.fillRect(i,j,1,1); }
  const finder = (fx,fy) => { x.fillStyle="#003057"; x.fillRect(fx,fy,7,7); x.fillStyle="#fff"; x.fillRect(fx+1,fy+1,5,5); x.fillStyle="#003057"; x.fillRect(fx+2,fy+2,3,3); };
  finder(0,0); finder(N-7,0); finder(0,N-7);
  const left = 15 - Math.floor((Date.now()%15000)/1000), t = document.getElementById("qrTimer");
  if(t) t.textContent = `Code refreshes in ${left}s. Screenshots will not scan.`;
}

  let s = [...w.serial].reduce((a,ch)=>a*33+ch.charCodeAt(0)>>>0,11) >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  x.fillStyle="#fff"; x.fillRect(0,0,N,N); x.fillStyle="#14213a";
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){ const inF=(i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9); if(!inF && rnd()>.52) x.fillRect(i,j,1,1); }
  [[0,0],[N-7,0],[0,N-7]].forEach(([fx,fy])=>{ x.fillStyle="#14213a"; x.fillRect(fx,fy,7,7); x.fillStyle="#fff"; x.fillRect(fx+1,fy+1,5,5); x.fillStyle="#14213a"; x.fillRect(fx+2,fy+2,3,3); });
}

async function startCam(){
  const msg = t => { const m = document.getElementById("scanMsg"); if(m) m.textContent = t; };
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no camera");
    const st = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false});
    if(!scan){ st.getTracks().forEach(t=>t.stop()); return; }
    scan.stream = st; const v = document.getElementById("scanVid"); if(!v) return stopCam();
    v.srcObject = st; await v.play();
    const det = ("BarcodeDetector" in window) ? new BarcodeDetector({formats:["qr_code"]}) : null;
    if(!det) await loadJsQR();
    const cv = document.createElement("canvas"), cx = cv.getContext("2d", {willReadFrequently:true});
    msg("Looking for the gate code\u2026");
    scan.timer = setInterval(async ()=>{
      if(!scan || scan.done || !v.videoWidth) return;
      try{
        let txt = null;
        if(det){ const r = await det.detect(v); if(r.length) txt = r[0].rawValue; }
        else if(window.jsQR){ cv.width = v.videoWidth; cv.height = v.videoHeight; cx.drawImage(v,0,0); const d = cx.getImageData(0,0,cv.width,cv.height); const r = jsQR(d.data, d.width, d.height); if(r) txt = r.data; }
        if(txt) handleGatePayload(txt);
      }catch(e){}
    }, 300);
  }catch(e){ msg("Camera isn't available here. Enter the gate code or use the demo button."); }
}
function stopCam(){ if(!scan) return; if(scan.timer) clearInterval(scan.timer); if(scan.stream) scan.stream.getTracks().forEach(t=>t.stop()); }
function handleGatePayload(txt){
  const m = /^AUDRAIN-CHECKIN:([A-Z0-9]+):([A-Z0-9]+)$/.exec(String(txt).trim());
  const g = m && GATES[m[2]];
  if(!g || g.ev!==m[1]){ const el = document.getElementById("scanMsg"); if(el) el.textContent = "That isn't an Audrain gate code."; return; }
  admit(m[2]);
}
function admit(gk){
  if(!scan || scan.done) return; scan.done = true;
  const g = GATES[gk], d = today(), res = [];
  scan.targets.map(sr=>state.wallet.find(w=>w.serial===sr && !w.transferred)).filter(Boolean).forEach(t=>{
    if(t.ev!==g.ev){ res.push([t, "wrong"]); return; }
    const re = t.used.includes(d); if(!re) t.used.push(d); res.push([t, re ? "re" : "in"]);
  });
  saveWallet(); stopCam(); scan = null; closeSheet();
  const ok = res.filter(r=>r[1]!=="wrong"), allRe = ok.length && ok.every(r=>r[1]==="re");
  const el = document.getElementById("admitted");
  el.className = "admitted" + (!ok.length ? " bad" : allRe ? " re" : "");
  const now = new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit"});
  el.innerHTML = `${ok.length ? `<svg class="chk" viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="48"/><path d="M32 57 L48 73 L80 39"/></svg>` : ""}
    <h1>${!ok.length ? "NOT VALID HERE" : allRe ? "RE-ENTRY" : "ADMITTED"}</h1>
    <div style="font-weight:700">${esc(g.name)}</div><div class="admclock">${now}</div>
    <div class="alist">${res.map(([t,r])=>`<div><b>${r==="wrong"?"\u2715":"\u2713"} ${esc(t.tname || t.type || "Guest")}</b><span>${t.serial}${r==="re"?" \u00b7 re-entry":r==="wrong"?" \u00b7 wrong entrance":""}</span></div>`).join("")}</div>
    <div style="opacity:.9;font-size:13.5px">${ok.length} of ${res.length} checked in. Show this screen to the gate staff.</div>
    <button type="button" data-admdone="1">Done</button>`;
  el.hidden = false; if(navigator.vibrate) try{ navigator.vibrate(ok.length?[60,40,60]:[200]); }catch(e){}
}

function receiveCode(raw){

function glyph(a){ if(a.type==="zone"){ const m = (a.name||"").match(/\b([A-Z])\b/); return m ? m[1] : "A"; } return ITEM_TYPES[a.type][2]; }
function edits(){ return state.edit && state.mapDraft ? state.mapDraft : state.mapPub; }
function posOf(key, ll){ const m = edits().moved[key]; return m || ll; }
function gone(key){ return edits().removed.includes(key); }
function editorPopup(key, label){ return state.edit ? `<div style="margin-top:6px;display:flex;gap:6px"><button type="button" data-editem="${key}">Edit</button><button type="button" data-rmitem="${key}">Remove</button></div>` : ""; }
function placeMarker(key, ll, icon, title, html, layer){
  if(gone(key)) return null;
  const m = L.marker(posOf(key, ll), {icon, title, draggable: state.edit}).bindPopup(html + editorPopup(key, title)).addTo(layer);
  if(state.edit) m.on("dragend", ev=>{ const p = ev.target.getLatLng(); const nl = [+p.lat.toFixed(6), +p.lng.toFixed(6)];
    if(key.startsWith("a:")){ const a = state.mapDraft.added.find(x=>x.id===key); if(a) a.ll = nl; } else state.mapDraft.moved[key] = nl;
    markDirty(); toast("Moved. Publish to update everyone."); });

}
function initMap(){
  const el = document.getElementById("lmap"); if(!el) return;

  lmap = L.map(el, {zoomControl:true, attributionControl:true, scrollWheelZoom:false}); lmap.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  let ok = 0, bad = 0;
  const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, maxNativeZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(lmap);
  tiles.on("tileload", ()=>ok++); tiles.on("tileerror", ()=>{ bad++; if(bad>6 && !ok){ const n = document.getElementById("mapNote"); if(n) n.textContent = "Street tiles are blocked in this preview. They load in the installed app; pins, parking and trolley lines still show."; } });
  const D = state.mapDay, pts = [];
  mapLayers = {venues:L.layerGroup(), parking:L.layerGroup(), trolley:L.layerGroup(), ferry:L.layerGroup(), extra:L.layerGroup(), grounds:L.layerGroup()};
  Object.entries(VENUES).forEach(([k,v])=>{

    if(m){ if(!state.edit) m.on("click", ()=>showVenue(k, true)); if(n) pts.push(m.getLatLng()); }
  });
  LOTS.filter(l=>l.days[D]).forEach(l=>{ const h = l.days[D];
    const m = placeMarker("l:"+l.id, l.ll, mkIcon("mk-park","P"), l.name, `<b>Parking: ${esc(l.name)}</b><br>${esc(l.addr)}<br>${fmtTime(h[0]).hm} ${fmtTime(h[0]).ap} to ${fmtTime(h[1]).hm} ${fmtTime(h[1]).ap} \u00b7 Free, first come<br><a href="${gmaps(l.addr)}" target="_blank" rel="noopener">Directions</a>`, mapLayers.parking);
    if(m) pts.push(m.getLatLng()); });
  const seen = {}, sLL = k => posOf("s:"+k, STOPS[k].ll);
  TROLLEY.filter(t=>t.d===D).forEach(t=>{
    const geo = t.stops.filter(k=>STOPS[k].ll && !gone("s:"+k));
    if(geo.length>1) L.polyline(geo.map(sLL), {color:t.c, weight:4, opacity:.85, dashArray:"8 6"}).addTo(mapLayers.trolley);
    geo.forEach(k=>{ (seen[k] = seen[k] || []).push(t); });
  });
  Object.entries(seen).forEach(([k,ts])=>{ const st = STOPS[k];
    const m = placeMarker("s:"+k, st.ll, mkIcon("mk-stop","T", st.approx), st.name, `<b>Trolley stop: ${esc(st.name)}</b><br>${esc(st.note||"")}<br>${ts.map(t=>`${fmtTime(t.s).hm} ${fmtTime(t.s).ap}\u2013${fmtTime(t.e).hm} ${fmtTime(t.e).ap} loop`).join("<br>")}`, mapLayers.trolley);
    if(m) pts.push(m.getLatLng()); });
  if(FERRY.days.includes(D)) FERRY.from.filter(f=>f.ll).forEach(f=>{ const m = placeMarker("f:"+f.name, f.ll, mkIcon("mk-ferry","F"), f.name, `<b>Ferry: ${esc(f.name)}</b><br>Sat & Sun service. Tickets via ${FERRY.seller}, code ${FERRY.code}.`, mapLayers.ferry); if(m) pts.push(m.getLatLng()); });
  edits().added.filter(a=>!a.days.length || a.days.includes(D)).forEach(a=>{ const ty = ITEM_TYPES[a.type];
    placeMarker(a.id, a.ll, mkIcon(ty[1], glyph(a)), a.name, `<b>${esc(ty[0])}: ${esc(a.name)}</b>${a.hours?`<br>${esc(a.hours)}`:""}${a.note?`<br>${esc(a.note)}`:""}${a.days.length?`<br>${a.days.map(d=>dayParts(d).wd).join(", ")}`:"<br>All days"}`, mapLayers[ty[3]]); });
  if(state.mapMode==="grounds"){
    mapLayers.grounds.addTo(lmap); mapLayers.extra.addTo(lmap);
    const fv = VENUES.fort; L.marker(posOf("v:fort", fv.ll), {icon: mkIcon("mk-venue",""), title: fv.name}).bindPopup(`<b>${esc(fv.name)}</b><br>${esc(fv.addr)}`).addTo(lmap);
    const gp = []; mapLayers.grounds.eachLayer(l=>gp.push(l.getLatLng()));
    if(view) lmap.setView(view.c, view.z); else if(gp.length>1) lmap.fitBounds(L.latLngBounds(gp).pad(0.3)); else lmap.setView([41.4772,-71.3388], 16);
  } else {
    Object.entries(mapLayers).forEach(([k,g])=>{ if(k==="extra" || (k!=="grounds" && state.layers[k])) g.addTo(lmap); });
    if(view) lmap.setView(view.c, view.z); else if(pts.length) lmap.fitBounds(L.latLngBounds(pts).pad(0.12)); else lmap.setView([41.482,-71.315], 13);
  }
  lmap.on("click", ev=>{ if(!state.edit || !state.placeType) return; const ll = [+ev.latlng.lat.toFixed(6), +ev.latlng.lng.toFixed(6)]; itemForm(null, state.placeType, ll); });
  setTimeout(()=>lmap && lmap.invalidateSize(), 60);
}

    ${single ? "" : `<div class="eyebrow" style="color:var(--muted)">Size / option</div><div class="sizes" role="group" aria-label="Size">${p.v.map(x=>`<button type="button" data-size="${x.id}" aria-pressed="${x.id===state.size}" ${x.a?"":"disabled"}>${esc(x.t)}</button>`).join("")}</div>`}
    <div class="sheetfoot" style="justify-content:stretch"><button class="buy ghost" type="button" data-addbag="1" style="flex:1">Add to bag</button><a class="buy" style="flex:1" href="${STORE}/cart/${state.size}:1" target="_blank" rel="noopener">Buy now</a></div>
    <a class="link" href="${STORE}/products/${p.h}" target="_blank" rel="noopener">View on the store</a>
    <div class="sheetfoot"><button class="buy ghost" type="button" data-close="1">Close</button></div>`);
}
function bagSheet(){
  if(!state.bag.length){ openSheet("Your bag", `<p>Your bag is empty.</p><div class="sheetfoot"><button class="buy" type="button" data-close="1">Keep shopping</button></div>`); return; }
  const total = state.bag.reduce((a,b)=>a+b.p*b.q,0);
  openSheet("Your bag", `${state.bag.map((b,i)=>`<div class="bagline"><img src="${b.img}" alt=""><div><div class="title">${esc(b.t)}</div><div class="price">${esc(b.vt)} \u00b7 ${b.q} \u00d7 ${money(b.p)}</div></div><button class="buy ghost" type="button" data-rmbag="${i}">Remove</button></div>`).join("")}
    <div class="section-head"><b>Subtotal</b><b>${money(total)}</b></div>
    <a class="buy" style="padding:12px" href="${bagUrl()}" target="_blank" rel="noopener">Check out on the Audrain store</a>
    <p class="price">Pay with Apple Pay (on Apple devices), Google Pay, PayPal, Venmo, Shop Pay or card. Shipping and tax are handled by Shopify checkout.</p>
    <div class="sheetfoot"><button class="buy ghost" type="button" data-close="1">Keep shopping</button></div>`);
}

function showVenue(k, fromMap){
  const v = VENUES[k], list = EVENTS.filter(e=>e.v===k), card = document.getElementById("venueCard");
  if(!fromMap && v.ll) flyTo(v.ll, 16);
  card.innerHTML = `<div class="eyebrow">Venue</div><h2>${esc(v.name)}</h2><div class="addr">${esc(v.addr)}</div>
    <div class="notice">Getting there: ${esc(v.get)}</div>
    <a class="buy ghost" href="${gmaps(v.name+", "+v.addr)}" target="_blank" rel="noopener">Directions</a>
    <div class="list">${list.map(e=>row(e,true)).join("")}</div>`;
  if(fromMap) card.scrollIntoView({behavior:"smooth", block:"nearest"});
}

document.addEventListener("click", ev=>{
  const t = ev.target.closest("button, g.pin, a[data-extpay]"); if(!t) return;
  const ds = t.dataset;
  
  if(ds.tab){ go(ds.tab); return; }
  if(ds.go){ if(ds.go==="itinerary") state.itinMode="mine"; closeSheet(); go(ds.go); return; }
  if(ds.mode){ state.itinMode = ds.mode; render(); return; }
  if(ds.day){ state.day = ds.day; render(); return; }
  if(ds.save){ const id=ds.save; if(booked(id)){ toast("Booked events stay in your itinerary"); return; } state.saved.has(id)?state.saved.delete(id):state.saved.add(id); store.set("ae.saved",[...state.saved]); toast(state.saved.has(id)?"Added to your itinerary. We'll remind you before it starts.":"Removed from your itinerary"); render(); return; }
  if(ds.buy){ const e = EVENTS.find(x=>x.id===ds.buy), dp = dayParts(e.d), tm = fmtTime(e.t); checkout({kind:"event", ref:e.id, code:"EV", title:e.title, sub:`${dp.wd} ${tm.hm} ${tm.ap} · ${VENUES[e.v].short}`, price:(typeof e.price==="number"?e.price:null), from:e.from, url:e.url||e.link}); return; }
  if(ds.buypass){ const p = PASSES.find(x=>x.id===ds.buypass); checkout({kind:"pass", ref:p.id, code:"PS", title:p.t, sub:p.d, price:p.price, url:p.url}); return; }
  if(ds.addon){ const a = ADDONS.find(x=>x.id===ds.addon); checkout({kind:"addon", ref:a.id, code:a.code, title:a.t, sub:`${a.use} · add-on`, price:null}); return; }
  if(ds.shop){ openSheet("Buy tickets", `<div class="eyebrow">Passes</div><div class="list">${PASSES.map(p=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div class="info"><div class="title">${p.t}</div><div class="meta">${p.d}</div></div><div class="actions"><button class="buy" type="button" data-buypass="${p.id}">${money(p.price)}</button></div></div>`).join("")}</div>
    <div class="eyebrow">Events</div><div class="list">${EVENTS.filter(e=>e.kind==="ticketed" && e.id!=="spike-pod").map(e=>{const dp=dayParts(e.d),tm=fmtTime(e.t);return `<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div class="info"><div class="title">${esc(e.title)}</div><div class="meta"><span>${dp.wd} ${tm.hm} ${tm.ap}</span><span>${esc(VENUES[e.v].short)}</span></div></div><div class="actions">${e.cap==="full"?`<button class="buy ghost" type="button" data-wait="${e.id}">Waitlist</button>`:`<button class="buy" type="button" data-buy="${e.id}">${priceLabel(e)}</button>`}</div></div>`}).join("")}</div>
    <div class="eyebrow">Add-ons</div><div class="list">${ADDONS.map(a=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div class="info"><div class="title">${a.t}</div><div class="meta">${a.use}</div></div><div class="actions"><button class="buy" type="button" data-addon="${a.id}">Add</button></div></div>`).join("")}</div>
    <div class="eyebrow">Merchandise</div><button type="button" class="shopall" data-go="shop" data-close="1" style="width:100%;text-align:left"><span><b>Concours &amp; Motor Week merch</b><br><span class="price">${PRODUCTS.length} items: hats, polos, jackets, mugs and more</span></span><span class="buy">Shop</span></button>
    <div class="sheetfoot"><button class="buy ghost" type="button" data-close="1">Close</button></div>`); return; }
  if(ds.link){ openSheet("Link a website order", `<p>Bought tickets on the Audrain website? Link the order and every ticket appears here with the same serials as your badge.</p>
    <div class="field"><label for="ordNo" class="price">Order number</label><input id="ordNo" inputmode="numeric" placeholder="e.g. 48213977"></div>
    <div class="field"><label for="ordEmail" class="price">Email used at checkout</label><input id="ordEmail" type="email" placeholder="you@example.com"></div>
    <button class="pay" type="button" data-linkgo="1" style="background:var(--btn);color:var(--btn-fg)">Link order (demo)</button>
    <div class="sheetfoot"><button class="buy ghost" type="button" data-close="1">Cancel</button></div>`); return; }
  if(ds.linkgo){ const no = (($("#ordNo")||{}).value||"").trim() || String(48000000 + Math.floor(Math.random()*999999)); const id = "WEB-" + no.replace(/\D/g,"").slice(-8);
    if(state.orders.some(o=>o.id===id)){ toast("That order is already linked"); return; }
    ["Adult","Adult","Youth"].forEach(tp=>state.wallet.push({kind:"pass", ref:"ga2", label:"Two-Day General Admission", type:tp, sub:"Sat & Sun \u00b7 linked from website", serial:newSerial("WEB"), order:id, used:[], ev:"ACMW"}));
    state.orders.unshift({id, title:"Two-Day General Admission", sub:"Linked from website order " + no, status:"website", rail:"website", at:Date.now()});
    saveWallet(); saveOrders(); state.openOrder = id; closeSheet(); toast("Website order linked: 3 tickets (sample)"); go("tickets"); return; }
  if(ds.q){ const l = cart.lines[Number(ds.ql||0)]; l.qty = Math.max(0, Math.min(10, l.qty + Number(ds.q))); if(cart.lines.length===1 && l.qty<1) l.qty = 1; paintCart(); return; }
  if(ds.pm){ state.pm = ds.pm; paintCart(); return; }
  if(ds.extpay){ cart.opened = true; setTimeout(paintCart, 400); return; }
  if(ds.paidext){ if(!state.account){ afterSignIn = ()=>issueOrder("pending"); signInSheet("Sign in to keep your tickets on this phone."); return; } issueOrder("pending"); return; }
  if(ds.buyadm){ checkout({kind:"admission", ref:"admission", code:"AAM", title:"Audrain Automobile Museum admission", sub:"222 Bellevue Ave \u00b7 valid any open day"}); return; }
  if(ds.order){ state.openOrder = ds.order; render(); const c = document.getElementById("carousel"); if(c) c.scrollIntoView({behavior:"smooth", block:"nearest"}); return; }
  if(ds.checkin){ const [kind,val] = ds.checkin.split(":"); const targets = kind==="order" ? orderTickets(val).filter(w=>!w.transferred).map(w=>w.serial) : [val];
    scanSheet(targets, kind==="order" ? `Checking in ${targets.length} tickets together` : "Checking in 1 ticket"); return; }
  if(ds.simgate){ admit($("#simGate").value); return; }
  if(ds.gatecode){ const c = ($("#gateCode").value||"").trim(); const gk = Object.keys(GATES).find(k=>GATES[k].code===c); if(!gk){ const m = $("#scanMsg"); if(m) m.textContent = "That code doesn't match a gate. Check the sign."; return; } admit(gk); return; }
  if(ds.admdone){ $("#admitted").hidden = true; render(); return; }
  if(ds.names){ namesSheet(ds.names); return; }
  if(ds.savenames){ document.querySelectorAll("[data-nmserial]").forEach(i=>{ const w = state.wallet.find(x=>x.serial===i.dataset.nmserial); if(w) w.tname = i.value.trim(); }); saveWallet(); closeSheet(); toast("Names saved"); render(); return; }
  if(ds.xfer){ xferSheet(ds.xfer); return; }
  if(ds.copyxfer){ const v = $("#xferLink").value; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(()=>toast("Link copied")).catch(()=>{ $("#xferLink").select(); toast("Select and copy the link"); }); return; }
  if(ds.sharexfer){ const v = $("#xferLink").value; if(navigator.share){ navigator.share({title:"Your Audrain ticket", url:v}).catch(()=>{}); } else { $("#xferLink").select(); toast("Sharing isn't available here. Copy the link instead."); } return; }
  if(ds.markxfer){ const w = state.wallet.find(x=>x.serial===ds.markxfer); if(w){ w.transferred = true; w.sentTo = ($("#xferTo").value||"").trim(); saveWallet(); } closeSheet(); toast("Ticket sent. Your copy is now marked Transferred."); render(); return; }
  if(ds.receive){ receiveSheet(); return; }
  if(ds.rxgo){ receiveCode($("#rxCode").value); return; }
  if(ds.addwallet){ toast("Apple Wallet and Google Wallet passes come from the ticketing system in the live app"); return; }
  if(ds.pay){ if(!state.account){ afterSignIn = ()=>{ pay(); }; signInSheet("Sign in to finish your purchase. Your tickets will be saved to your account."); return; } pay(); return; }
  if(ds.close){ closeSheet(); return; }
  if(ds.wait){ const e = EVENTS.find(x=>x.id===ds.wait); openSheet("Join the waitlist", `<p>${esc(e.title)} is full. Join the waitlist and we'll alert you if a seat opens. You'll have 20 minutes to claim it.</p><div class="sheetfoot"><button class="buy ghost" type="button" data-close="1">Not now</button><button class="buy" type="button" data-joinwait="${e.id}">Join waitlist</button></div>`); return; }
  if(ds.joinwait){ closeSheet(); toast("You're on the waitlist. We'll alert you if a seat opens."); return; }
  if(ds.showticket){ const w = state.wallet.find(x=>x.kind==="event" && x.ref===ds.showticket); if(w) state.openOrder = w.order; go("tickets"); return; }
  if(ds.open){ state.open = Number(ds.open); render(); return; }
  if(ds.venue){ showVenue(ds.venue); return; }
  if(ds.mapday){ state.mapDay = ds.mapday; render(); return; }
  if(ds.mapmode){ state.mapMode = ds.mapmode; if(lmap){ lmap.remove(); lmap = null; } render(); return; }
  if(ds.gomap){ state.mapMode = ds.gomap; if(lmap){ lmap.remove(); lmap = null; } go("map"); return; }
  if(ds.info){ state.infoTab = ds.info; render(); return; }
  if(ds.acct){ state.account ? accountSheet() : signInSheet(); return; }
  if(ds.install){ install(); return; }
  if(ds.gotoevent){ const e = EVENTS.find(x=>x.id===ds.gotoevent); if(e){ state.itinMode = "all"; state.day = e.d; state.venue = "all"; go("itinerary"); } return; }
  if(ds.layer){ const k = ds.layer; state.layers[k] = !state.layers[k]; t.setAttribute("aria-pressed", state.layers[k]); if(lmap){ state.layers[k] ? mapLayers[k].addTo(lmap) : lmap.removeLayer(mapLayers[k]); } return; }
  if(ds.fly){ const [kind,id] = ds.fly.split(":"); const l = LOTS.find(x=>x.id===id); if(l) flyTo(l.ll, 16); return; }
  if(ds.cat){ state.cat = ds.cat; render(); return; }
  if(ds.product){ state.size = null; productSheet(ds.product); return; }
  if(ds.size){ state.size = Number(ds.size); productSheet(state.prod); return; }
  if(ds.addbag){ const p = PRODUCTS.find(x=>x.h===state.prod), v = p.v.find(x=>x.id===state.size); const ex = state.bag.find(b=>b.id===v.id); if(ex) ex.q++; else state.bag.push({id:v.id, t:p.t, vt:v.t, p:v.p, q:1, img:p.img}); store.set("ae.bag", state.bag); closeSheet(); toast("Added to bag"); render(); return; }
  if(ds.bag){ bagSheet(); return; }
  if(ds.rmbag){ state.bag.splice(Number(ds.rmbag),1); store.set("ae.bag", state.bag); bagSheet(); render(); return; }
  if(ds.notify){ toast("We'll alert you when Winterfest tickets go on sale"); return; }
  if(ds.notifon){ enableNotifications(); return; }
  if(t.id==="alertsBtn"){ go("alerts"); return; }
  if(t.id==="installBtn"){ install(); return; }
  if(t.id==="acctBtn"){ state.account ? accountSheet() : signInSheet(); return; }
  if(ds.signin){ signInSheet(); return; }
  if(ds.auth){ const role = inviteRole(); if(role===null){ toast("That invite code isn't valid"); return; }
    signedIn(ds.auth==="apple" ? {name:"Apple ID user", email:"private relay (hidden by Apple)", method:"Apple", role} : {name:"Google user", email:"you@gmail.com", method:"Google", role}); return; }
  if(ds.sendcode){ const e = ($("#authEmail").value||"").trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){ toast("Enter a valid email"); return; } const role = inviteRole(); if(role===null){ toast("That invite code isn't valid"); return; } codeSheet(e, role); return; }
  if(ds.verify){ const c = ($("#authCode").value||"").trim(); if(!/^\d{6}$/.test(c)){ toast("Enter the 6-digit code"); return; } signedIn({name: ds.verify.split("@")[0], email: ds.verify, method:"email code", role: ds.role}); return; }
  if(ds.signout){ state.account = null; store.set("ae.account", null); state.edit = false; closeSheet(); paintAcct(); toast("Signed out"); render(); return; }
  if(ds.delacct){ deleteSheet(); return; }
  if(ds.delconfirm){ state.account = null; store.set("ae.account", null); state.saved = new Set(); store.set("ae.saved", []); state.edit = false; closeSheet(); paintAcct(); toast("Account deleted"); render(); return; }
  if(ds.gomapedit){ closeSheet(); state.edit = true; state.mapDraft = JSON.parse(JSON.stringify(state.mapPub)); go("map"); return; }
  if(ds.editmap){ state.edit = true; state.mapDraft = JSON.parse(JSON.stringify(state.mapPub)); render(); return; }
  if(ds.donemap){ if(dirtyCount()){ toast("Publish or discard your changes first"); return; } state.edit = false; state.placeType = null; state.mapDraft = null; render(); return; }
  if(ds.discardmap){ state.mapDraft = JSON.parse(JSON.stringify(state.mapPub)); state.placeType = null; render(); toast("Changes discarded"); return; }
  if(ds.publishmap){ state.mapPub = JSON.parse(JSON.stringify(state.mapDraft)); store.set("ae.mapedits", state.mapPub); state.placeType = null; render(); toast("Published. In the live app every phone gets the update."); return; }
  if(ds.exportmap){ const txt = JSON.stringify(state.mapDraft, null, 1); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast("Map data copied")).catch(()=>{ openSheet("Map data", `<textarea class="inp" rows="10" readonly>${esc(txt)}</textarea><div class="sheetfoot"><button class="buy" type="button" data-close="1">Done</button></div>`); }); return; }
  if(ds.editem){ if(lmap) lmap.closePopup(); if(ds.editem.startsWith("a:")) itemForm(ds.editem); else toast("Built-in pins can be moved or removed; add a new item to change details"); return; }
  if(ds.rmitem){ if(lmap) lmap.closePopup(); const k = ds.rmitem; if(k.startsWith("a:")) state.mapDraft.added = state.mapDraft.added.filter(x=>x.id!==k); else if(!state.mapDraft.removed.includes(k)) state.mapDraft.removed.push(k); render(); toast("Removed (draft)"); return; }
  if(ds.saveitem!==undefined && t.matches("[data-saveitem]")){ saveItem(ds.saveitem, ds.ll); return; }
});
document.addEventListener("change", ev=>{
  if(ev.target.id==="venueSel"){ state.venue = ev.target.value; render(); }
  if(ev.target.id==="placeSel"){ state.placeType = ev.target.value || null; render(); return; }
  if(ev.target.dataset && ev.target.dataset.mkt && state.account){ state.account.marketing = ev.target.checked; store.set("ae.account", state.account); }
  if(ev.target.dataset && ev.target.dataset.pref){ state.prefs[ev.target.dataset.pref] = ev.target.checked; store.set("ae.prefs", state.prefs); }
});
document.addEventListener("keydown", ev=>{
  if(ev.key==="Escape" && !$("#scrim").hidden) closeSheet();
  if((ev.key==="Enter"||ev.key===" ") && ev.target.matches && ev.target.matches("g.pin")){ ev.preventDefault(); showVenue(ev.target.dataset.venue); }
});
$("#scrim").addEventListener("click", ev=>{ if(ev.target.id==="scrim") closeSheet(); });

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt = e; });
function install(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; return; }
  openSheet("Install on your phone", `<p><b>iPhone</b></p><ol><li>Open the app link in Safari.</li><li>Tap the Share button.</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>
  <p><b>Android</b></p><ol><li>Open the app link in Chrome.</li><li>Tap the menu (three dots).</li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>
  <p class="notice">The app then opens full-screen from its own icon, like any other app.</p>
  <div class="sheetfoot"><button class="buy" type="button" data-close="1">Done</button></div>`);
}

if(!views[state.tab]) state.tab = "itinerary";
paintAcct();
render();
})();
</script>
