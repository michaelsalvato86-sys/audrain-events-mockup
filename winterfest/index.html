<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12304a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winterfest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Audrain Winterfest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a winter companion app - frosted ice palette, same five sections as the Concours app, each waiting for Winterfest content. */
:root{
  --ice:#eaf2f7; --frost:#ffffff; --deep:#12304a; --pine:#1f4d45; --ember:#c8643b; --muted:#5b6f80; --line:#d3e2ec;
  --bg:var(--ice); --fg:var(--deep); --surface:var(--frost);
  --display:"Fraunces", Georgia, serif; --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b1a28; --fg:#e4eef5; --surface:#13283b; --line:#22405a; --muted:#93aabd; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0b1a28; --fg:#e4eef5; --surface:#13283b; --line:#22405a; --muted:#93aabd; color-scheme:dark }
*{box-sizing:border-box} html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#12304a;color:#eaf2f7;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-size:22px;font-weight:700}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9fc3dc}
.pillbtn{border:1px solid rgba(234,242,247,.4);background:transparent;color:#eaf2f7;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.hero{border-radius:18px;padding:26px 20px;color:#eaf2f7;background:radial-gradient(120% 90% at 80% 0%,#2f6d8f 0%,#12304a 60%,#0b1f33 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero > *:not(canvas){position:relative}
.hero h1{font-family:var(--display);font-size:38px;line-height:1.02;margin:0;text-wrap:balance}
.hero p{margin:0;color:#c7dceb}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9fc3dc}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--ember);color:#fff;align-self:flex-start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h2{font-family:var(--display);font-size:20px;margin:0}
.muted{color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#12304a;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;color:#8fb0c8;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:4px 2px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:#f0b48f}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#12304a;color:#eaf2f7;border:1px solid #f0b48f;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;z-index:10;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){ .hero canvas{display:none} }
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><small>Audrain</small>Winterfest</div><button class="pillbtn" type="button" id="notifyTop">Get alerts</button></header>
  <main id="main"></main>
  <div class="tabs"><nav aria-label="Winterfest sections">
    <button type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button type="button" data-tab="itinerary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Itinerary</button>
    <button type="button" data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Map</button>
    <button type="button" data-tab="tickets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v3a2 2 0 0 0 0 4v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3a2 2 0 0 0 0-4z"/></svg>Tickets</button>
    <button type="button" data-tab="photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/></svg>Photos</button>
  </nav></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
const COPY = {
  home: null,
  itinerary: ["Itinerary", "Every Winterfest event by day, with your saved events and reminders."],
  map: ["Map", "Venues, parking and how to get between them."],
  tickets: ["Tickets", "Buy tickets and add-ons; your scannable tickets live here."],
  photos: ["Photos", "Share your Winterfest photos for the featured gallery."]
};
let tab = "home";
const $ = s => document.querySelector(s);
function home(){
  return `<section class="hero"><canvas id="snow" aria-hidden="true"></canvas><div class="eyebrow">Newport, Rhode Island</div><h1>Audrain Winterfest</h1><p>Schedule, tickets, map and photos for Winterfest, in its own app.</p><button class="btn" type="button" data-notify="1">Alert me when tickets go on sale</button></section>
  <div class="card"><h2>Coming soon</h2><p class="muted">Winterfest dates, events and venues will load here when they're announced. It works like the Concours app: build an itinerary, buy tickets and add-ons, scan in from your phone, get alerts and share photos.</p></div>
  <div class="grid">${["Itinerary","Tickets","Map","Photos"].map(x=>`<div class="card"><h2>${x}</h2><p class="muted">Ready for Winterfest content.</p></div>`).join("")}</div>`;
}
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>{ if(b.dataset.tab===tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("#main").innerHTML = tab==="home" ? home() : `<div class="card"><h2>${COPY[tab][0]}</h2><p class="muted">${COPY[tab][1]} Coming when Winterfest is announced.</p><button class="btn" type="button" data-notify="1">Get alerts</button></div>`;
  snow();
}
let raf=null;
function snow(){
  cancelAnimationFrame(raf); const c = document.getElementById("snow"); if(!c || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const x = c.getContext("2d"); const r = c.getBoundingClientRect(); c.width = r.width; c.height = r.height;
  const flakes = Array.from({length:60},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2+0.6,s:Math.random()*0.5+0.25,d:Math.random()*0.6-0.3}));
  const step = () => { x.clearRect(0,0,c.width,c.height); x.fillStyle="rgba(234,242,247,.85)"; flakes.forEach(f=>{ f.y+=f.s; f.x+=f.d; if(f.y>c.height){f.y=-4;f.x=Math.random()*c.width;} x.beginPath(); x.arc(f.x,f.y,f.r,0,6.283); x.fill(); }); raf = requestAnimationFrame(step); };
  step();
}
let tt=null; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2600); }
document.addEventListener("click", ev=>{ const b = ev.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; render(); window.scrollTo(0,0); }
  if(b.dataset.notify || b.id==="notifyTop"){ toast("We'll alert you when Winterfest tickets go on sale"); }
});
render();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
